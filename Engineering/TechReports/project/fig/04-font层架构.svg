<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560">
  <rect width="1240" height="560" fill="#ffffff"/>

  <!-- 图例: 线型承载"是否已接入"这一种语义 -->
  <line x1="880" y1="28" x2="940" y2="28" stroke="#315a73" stroke-width="2"/>
  <text x="948" y="32" font-family="sans-serif" font-size="12" fill="#17364b">已接入调用</text>
  <line x1="1052" y1="28" x2="1112" y2="28" stroke="#9aa4ad" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1120" y="32" font-family="sans-serif" font-size="12" fill="#9aa4ad">未接入</text>

  <!-- 上游: 未接入的消费者 -->
  <rect x="430" y="56" width="280" height="56" fill="none" stroke="#9aa4ad" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="570" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#17364b">ui / page / OSD</text>
  <text x="570" y="100" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9aa4ad">网络视频终端 刀 4 / 刀 9(未接入)</text>
  <line x1="570" y1="112" x2="570" y2="150" stroke="#9aa4ad" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="582" y="138" font-family="sans-serif" font-size="11" fill="#9aa4ad">font_draw_utf8 / font_measure_utf8</text>

  <!-- 左列: 两个 provider -->
  <rect x="40" y="150" width="300" height="100" fill="#ffffff" stroke="#315a73" stroke-width="2"/>
  <text x="190" y="172" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#17364b">font_builtin.c / g_builtin</text>
  <text x="190" y="194" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#17364b">5x7 点阵放大成 6x14 GRAY</text>
  <text x="190" y="214" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#17364b">open 不需要字体文件</text>
  <text x="190" y="234" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">FONT_DEV=builtin 时被选中</text>
  <text x="190" y="270" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">render(cp,&amp;b): buffer 借用到</text>
  <text x="190" y="286" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">下次 render/close</text>

  <rect x="40" y="300" width="300" height="120" fill="#ffffff" stroke="#315a73" stroke-width="2"/>
  <text x="190" y="322" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#17364b">font_freetype.c / g_freetype</text>
  <text x="190" y="344" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#17364b">FT_Init_FreeType → FT_Library</text>
  <text x="190" y="364" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#17364b">FT_New_Face → FT_Face</text>
  <text x="190" y="384" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#17364b">slot->bitmap → font_bitmap(借用)</text>
  <text x="190" y="404" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">simsun.ttc / msyh.ttc, ARM 静态库</text>

  <!-- provider → manager -->
  <line x1="340" y1="200" x2="430" y2="240" stroke="#315a73" stroke-width="2"/>
  <line x1="340" y1="360" x2="430" y2="310" stroke="#315a73" stroke-width="2"/>
  <text x="352" y="230" font-family="sans-serif" font-size="11" fill="#17364b">render(cp,&amp;b)</text>

  <!-- 中间: manager -->
  <rect x="430" y="150" width="280" height="250" fill="#ffffff" stroke="#315a73" stroke-width="2"/>
  <text x="570" y="172" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#17364b">font_manager.c</text>
  <text x="570" y="192" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#17364b">text_run()(测量与绘制同路径)</text>
  <text x="445" y="216" font-family="sans-serif" font-size="12" fill="#17364b">utf8_next 严格解码 → bad_offset</text>
  <text x="445" y="236" font-family="sans-serif" font-size="12" fill="#17364b">缺字 → missing++, 画 '?'</text>
  <text x="445" y="256" font-family="sans-serif" font-size="12" fill="#17364b">gx=(pen_x&gt;&gt;6)+left</text>
  <text x="445" y="276" font-family="sans-serif" font-size="12" fill="#17364b">gy=(pen_y&gt;&gt;6)-top</text>
  <text x="445" y="296" font-family="sans-serif" font-size="12" fill="#17364b">外框 = 各字形并集</text>
  <text x="445" y="316" font-family="sans-serif" font-size="12" fill="#17364b">alpha=0 跳过 / 屏外 clipped++</text>
  <text x="445" y="336" font-family="sans-serif" font-size="12" fill="#17364b">屏内 disp_blend_pixel drawn++</text>
  <text x="445" y="356" font-family="sans-serif" font-size="12" fill="#17364b">pen += advance(26.6)</text>
  <text x="445" y="386" font-family="sans-serif" font-size="11" fill="#555555">FONT_DEV / FONT_FILE / FONT_SIZE</text>

  <!-- manager → display -->
  <line x1="710" y1="270" x2="880" y2="270" stroke="#315a73" stroke-width="2"/>
  <text x="722" y="262" font-family="sans-serif" font-size="11" fill="#17364b">disp_blend_pixel</text>

  <!-- 右列: display 层 -->
  <rect x="880" y="150" width="320" height="250" fill="#ffffff" stroke="#315a73" stroke-width="2"/>
  <text x="1040" y="172" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#17364b">disp_manager.c</text>
  <text x="1040" y="192" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#17364b">disp_blend_pixel()</text>
  <text x="895" y="216" font-family="sans-serif" font-size="12" fill="#17364b">unpack 位段 → 0..255</text>
  <text x="895" y="236" font-family="sans-serif" font-size="12" fill="#17364b">mix=(fg*a+bg*(255-a)+127)/255</text>
  <text x="895" y="256" font-family="sans-serif" font-size="12" fill="#17364b">pack 回 xRGB8888 / RGB565</text>
  <rect x="895" y="276" width="290" height="52" fill="none" stroke="#315a73" stroke-width="1.5"/>
  <text x="1040" y="298" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#17364b">framebuffer.c: /dev/fb0</text>
  <text x="1040" y="316" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">模式由 EDID 定, 位段从 var 抄</text>
  <rect x="895" y="340" width="290" height="52" fill="none" stroke="#315a73" stroke-width="1.5"/>
  <text x="1040" y="362" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#17364b">memdisp.c: 假显存</text>
  <text x="1040" y="380" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">DISP_MEM=64x32x32x320, 0xAA 哨兵</text>

  <!-- 判据 -->
  <line x1="570" y1="400" x2="570" y2="470" stroke="#315a73" stroke-width="1.5"/>
  <text x="580" y="442" font-family="sans-serif" font-size="11" fill="#555555">font_test probe</text>
  <rect x="430" y="470" width="280" height="56" fill="none" stroke="#315a73" stroke-width="1.5"/>
  <text x="570" y="493" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#17364b">check_font_input.sh [11][12]</text>
  <text x="570" y="513" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">13 条判据 + 3 次注错见红</text>
</svg>
