# 全字段样例: 两颗测试项 + 字体
[global]
font_file = /usr/share/fonts/liberation/LiberationSans-Regular.ttf
font_size = 32
page_timeout_ms = 1500

[item]
name = mem        # 行尾注释
command = head -3 /proc/meminfo

[item]
name = ap3216
command = ap3216_read

[item]
name = serial
command = serial_loop --port /dev/ttymxc2
