<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect x="0" y="0" width="980" height="430" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- 用户态容器 -->
  <rect x="50" y="40" width="880" height="150" fill="#ffffff" stroke="#888888" stroke-width="1.2"/>
  <text x="70" y="66" font-size="14" fill="#555555">用户态</text>

  <rect x="110" y="92" width="300" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="260" y="117" font-size="15" text-anchor="middle" fill="#000000">你写的 app</text>
  <text x="260" y="138" font-size="12" text-anchor="middle" fill="#666666">hello.c</text>

  <rect x="620" y="92" width="290" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="765" y="117" font-size="15" text-anchor="middle" fill="#000000">库</text>
  <text x="765" y="138" font-size="12" text-anchor="middle" fill="#666666">glibc：printf / open / read 都在这里</text>

  <line x1="410" y1="122" x2="614" y2="122" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="512" y="112" font-size="12" text-anchor="middle" fill="#333333">调用 printf / open</text>

  <text x="765" y="177" font-size="11.5" text-anchor="middle" fill="#333333">printf 本身不越过红线，它最终调用的 write 才越</text>

  <!-- 用户/内核边界(红虚线) -->
  <line x1="50" y1="225" x2="930" y2="225" stroke="#c62828" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="70" y="248" font-size="12.5" fill="#b71c1c">用户 / 内核边界——系统调用从这条线穿过（ARM 上是一条 svc 指令）</text>

  <!-- 内核态容器 -->
  <rect x="50" y="265" width="880" height="115" fill="#ffffff" stroke="#888888" stroke-width="1.2"/>
  <text x="70" y="291" font-size="14" fill="#555555">内核态</text>

  <rect x="280" y="300" width="420" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="490" y="325" font-size="15" text-anchor="middle" fill="#000000">内核</text>
  <text x="490" y="346" font-size="12" text-anchor="middle" fill="#666666">文件系统 · 驱动 · 真正干活的地方</text>

  <!-- open/read 穿线 -->
  <path d="M 765 152 V 296" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="776" y="288" font-size="12" fill="#333333">open / read 发系统调用</text>
  <text x="782" y="306" font-size="12" fill="#333333">功能由内核实现</text>

  <!-- 图例 -->
  <line x1="50" y1="408" x2="90" y2="408" stroke="#c62828" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="96" y="413" font-size="12" fill="#333333">用户态与内核态的边界（红线）</text>
  <line x1="330" y1="408" x2="370" y2="408" stroke="#000000" stroke-width="1.5"/>
  <text x="376" y="413" font-size="12" fill="#333333">调用 / 系统调用（实线）</text>
</svg>
