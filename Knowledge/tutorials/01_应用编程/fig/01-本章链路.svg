<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="690" viewBox="0 0 1360 690" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect x="0" y="0" width="1360" height="690" fill="#ffffff"/>

  <!-- ===== 主流程框 ===== -->
  <rect x="30" y="290" width="110" height="56" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="85" y="313" font-size="15" text-anchor="middle" fill="#000000">hello.c</text>
  <text x="85" y="333" font-size="11" text-anchor="middle" fill="#666666">同一份源码</text>

  <rect x="220" y="120" width="200" height="62" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="320" y="145" font-size="15" text-anchor="middle" fill="#000000">本机 gcc</text>
  <text x="320" y="167" font-size="12" text-anchor="middle" fill="#666666">编给电脑自己（第 1 节）</text>

  <rect x="220" y="430" width="200" height="62" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="320" y="455" font-size="15" text-anchor="middle" fill="#000000">交叉编译工具链</text>
  <text x="320" y="477" font-size="11.5" text-anchor="middle" fill="#666666">arm-linux-gnueabihf-gcc（第 2 节）</text>

  <rect x="490" y="126" width="160" height="56" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="570" y="149" font-size="15" text-anchor="middle" fill="#000000">x86-64 ELF</text>
  <text x="570" y="169" font-size="11.5" text-anchor="middle" fill="#666666">PIE / 动态链接</text>

  <rect x="490" y="436" width="160" height="56" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="570" y="459" font-size="15" text-anchor="middle" fill="#000000">ARM ELF</text>
  <text x="570" y="479" font-size="11.5" text-anchor="middle" fill="#666666">动态或 -static</text>

  <rect x="730" y="126" width="170" height="56" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="815" y="149" font-size="15" text-anchor="middle" fill="#000000">电脑上 ./hello</text>
  <text x="815" y="169" font-size="11.5" text-anchor="middle" fill="#666666">直接执行</text>

  <rect x="730" y="436" width="170" height="62" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="815" y="461" font-size="15" text-anchor="middle" fill="#000000">串口传输（第 4 节）</text>
  <text x="815" y="483" font-size="11" text-anchor="middle" fill="#666666">gzip 转 base64，分块校验重传</text>

  <!-- execve 四道关 -->
  <rect x="950" y="408" width="205" height="118" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="1052" y="431" font-size="14.5" text-anchor="middle" fill="#000000">内核 execve 四道关（第 3 节）</text>
  <text x="1052" y="453" font-size="11.5" text-anchor="middle" fill="#333333">① binfmt_misc：有无登记的规则</text>
  <text x="1052" y="471" font-size="11.5" text-anchor="middle" fill="#333333">② binfmt_script：是不是 #! 脚本</text>
  <text x="1052" y="489" font-size="11.5" text-anchor="middle" fill="#333333">③ binfmt_elf：头四字节 \x7fELF</text>
  <text x="1052" y="507" font-size="11.5" text-anchor="middle" fill="#333333">④ elf_check_arch：e_machine</text>

  <!-- ===== 下场框 ===== -->
  <rect x="1210" y="118" width="140" height="72" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="1280" y="147" font-size="14" text-anchor="middle" fill="#1b5e20">Hello, world!</text>
  <text x="1280" y="168" font-size="11.5" text-anchor="middle" fill="#1b5e20">exit 0</text>

  <rect x="1210" y="330" width="140" height="76" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="1280" y="359" font-size="14" text-anchor="middle" fill="#1b5e20">Hello, learner!</text>
  <text x="1280" y="380" font-size="11.5" text-anchor="middle" fill="#1b5e20">exit 0</text>
  <text x="1280" y="398" font-size="11" text-anchor="middle" fill="#1b5e20">（-static 直达 main）</text>

  <rect x="1210" y="452" width="140" height="76" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="1280" y="481" font-size="12.5" text-anchor="middle" fill="#b71c1c">GLIBC_2.34</text>
  <text x="1280" y="500" font-size="12.5" text-anchor="middle" fill="#b71c1c">not found</text>
  <text x="1280" y="520" font-size="11" text-anchor="middle" fill="#b71c1c">exit 1（动态版）</text>

  <rect x="1210" y="574" width="140" height="76" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="1280" y="603" font-size="12.5" text-anchor="middle" fill="#b71c1c">Exec format</text>
  <text x="1280" y="622" font-size="12.5" text-anchor="middle" fill="#b71c1c">error</text>
  <text x="1280" y="642" font-size="11" text-anchor="middle" fill="#b71c1c">exit 126（x86 拷上板）</text>

  <!-- ===== 主流程实线箭头 ===== -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
    </marker>
  </defs>

  <line x1="140" y1="300" x2="216" y2="163" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="140" y1="336" x2="216" y2="449" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="420" y1="151" x2="486" y2="151" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="420" y1="461" x2="486" y2="461" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="650" y1="151" x2="726" y2="151" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="650" y1="461" x2="726" y2="461" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="900" y1="154" x2="1206" y2="148" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="900" y1="465" x2="946" y2="465" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="1155" y1="435" x2="1206" y2="386" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="1178" y="404" font-size="11" fill="#1b5e20">静态</text>
  <line x1="1155" y1="500" x2="1206" y2="490" stroke="#c62828" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrR)"/>
  <text x="1178" y="512" font-size="11" fill="#b71c1c">动态</text>

  <!-- x86 拷上板的对照路径(虚线红) -->
  <path d="M 610 182 V 400 H 690 V 612 H 1206" fill="none" stroke="#c62828" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrR)"/>
  <text x="705" y="604" font-size="11.5" fill="#b71c1c">把 x86 程序拷到板上跑，同一个错（第 5.1 节）</text>

  <!-- ===== 图例 ===== -->
  <rect x="30" y="600" width="16" height="16" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="54" y="613" font-size="12" fill="#333333">跑通</text>
  <rect x="100" y="600" width="16" height="16" fill="#ffebee" stroke="#c62828" stroke-width="1.2"/>
  <text x="124" y="613" font-size="12" fill="#333333">被拦下 / 失败</text>
  <line x1="216" y1="608" x2="256" y2="608" stroke="#000000" stroke-width="1.5"/>
  <text x="262" y="613" font-size="12" fill="#333333">主流程（实线）</text>
  <line x1="370" y1="608" x2="410" y2="608" stroke="#c62828" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="416" y="613" font-size="12" fill="#333333">失败 / 对照路径（虚线）</text>
</svg>
