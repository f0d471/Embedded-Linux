<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
  <text x="30" y="28" font-size="15" fill="#000000">mini_proj 的依赖图(steps/step4 完成后的样子)</text>

  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- 节点 -->
  <rect x="40" y="210" width="120" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="100" y="235" font-size="14" text-anchor="middle" font-family="Consolas, monospace" fill="#000000">app</text>

  <rect x="260" y="80" width="120" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="320" y="105" font-size="14" text-anchor="middle" font-family="Consolas, monospace" fill="#000000">display.o</text>
  <rect x="260" y="210" width="120" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="320" y="235" font-size="14" text-anchor="middle" font-family="Consolas, monospace" fill="#000000">main.o</text>
  <rect x="260" y="340" width="120" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="320" y="365" font-size="14" text-anchor="middle" font-family="Consolas, monospace" fill="#000000">math_ops.o</text>

  <rect x="500" y="80" width="120" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="560" y="105" font-size="14" text-anchor="middle" font-family="Consolas, monospace" fill="#000000">display.c</text>
  <rect x="500" y="210" width="120" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="560" y="235" font-size="14" text-anchor="middle" font-family="Consolas, monospace" fill="#000000">main.c</text>
  <rect x="500" y="360" width="120" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="560" y="385" font-size="14" text-anchor="middle" font-family="Consolas, monospace" fill="#000000">math_ops.c</text>

  <rect x="730" y="8" width="120" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="790" y="33" font-size="14" text-anchor="middle" font-family="Consolas, monospace" fill="#000000">config.h</text>
  <rect x="730" y="150" width="120" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="790" y="175" font-size="14" text-anchor="middle" font-family="Consolas, monospace" fill="#000000">display.h</text>
  <rect x="730" y="270" width="120" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="790" y="295" font-size="14" text-anchor="middle" font-family="Consolas, monospace" fill="#000000">math_ops.h</text>

  <!-- 实线: Makefile 规则写出的边 -->
  <line x1="160" y1="222" x2="256" y2="108" stroke="#000000" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="160" y1="231" x2="256" y2="231" stroke="#000000" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="160" y1="240" x2="256" y2="352" stroke="#000000" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="380" y1="98" x2="496" y2="101" stroke="#000000" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="380" y1="231" x2="496" y2="231" stroke="#000000" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="380" y1="364" x2="496" y2="376" stroke="#000000" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- 虚线: .d 补进来的边 -->
  <line x1="360" y1="80" x2="726" y2="26" stroke="#000000" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#a2)"/>
  <line x1="380" y1="112" x2="726" y2="164" stroke="#000000" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#a2)"/>
  <line x1="380" y1="218" x2="726" y2="182" stroke="#000000" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#a2)"/>
  <line x1="380" y1="244" x2="726" y2="286" stroke="#000000" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#a2)"/>
  <line x1="380" y1="352" x2="726" y2="296" stroke="#000000" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#a2)"/>

  <!-- 箭头方向说明: 箭头指向依赖 -->
  <text x="30" y="416" font-size="12" fill="#333333">箭头指向依赖(X --&gt; Y 表示"要 X 先要 Y")。</text>
  <line x1="30" y1="440" x2="80" y2="440" stroke="#000000" stroke-width="1.5"/>
  <text x="90" y="445" font-size="12" fill="#333333">Makefile 里规则写出的边(第 1、3 节)</text>
  <line x1="360" y1="440" x2="410" y2="440" stroke="#000000" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="420" y="445" font-size="12" fill="#333333">.d 文件补进来的边(第 5 节);没有 .d 时这 5 条边不存在</text>
</svg>
