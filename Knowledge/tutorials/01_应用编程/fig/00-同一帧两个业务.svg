<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect x="0" y="0" width="1080" height="500" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>

  <text x="40" y="40" font-size="17" fill="#000000">同一帧，两个业务：监看与质检共用一条流水线</text>
  <text x="40" y="64" font-size="12" fill="#666666">质检只在解码后的 RGB 上多挂一个消费者；检测慢不能把显示卡住</text>

  <rect x="40" y="130" width="180" height="80" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="130" y="160" font-size="14" text-anchor="middle" fill="#000000">采集线程</text>
  <text x="130" y="182" font-size="11.5" text-anchor="middle" fill="#666666">V4L2 从 /dev/video0 取帧</text>

  <rect x="260" y="130" width="160" height="80" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="340" y="160" font-size="14" text-anchor="middle" fill="#000000">帧队列</text>
  <text x="340" y="182" font-size="11.5" text-anchor="middle" fill="#666666">满则丢最旧</text>

  <rect x="460" y="130" width="160" height="80" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="540" y="160" font-size="14" text-anchor="middle" fill="#000000">解码线程</text>
  <text x="540" y="182" font-size="11.5" text-anchor="middle" fill="#666666">MJPEG 解成 RGB</text>

  <rect x="660" y="130" width="160" height="80" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="740" y="160" font-size="14" text-anchor="middle" fill="#000000">RGB 队列</text>
  <text x="740" y="182" font-size="11.5" text-anchor="middle" fill="#666666">两路消费者从这里取</text>

  <line x1="220" y1="170" x2="256" y2="170" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="420" y1="170" x2="456" y2="170" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="620" y1="170" x2="656" y2="170" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="860" y="60" width="180" height="80" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="950" y="90" font-size="14" text-anchor="middle" fill="#000000">显示线程 → fb0</text>
  <text x="950" y="112" font-size="11.5" text-anchor="middle" fill="#666666">监看业务，30 帧/秒也要跟得上</text>

  <path d="M 820 150 H 840 V 100 H 856" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="860" y="220" width="180" height="80" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="950" y="250" font-size="14" text-anchor="middle" fill="#000000">检测线程</text>
  <text x="950" y="272" font-size="11.5" text-anchor="middle" fill="#666666">inspect 五条规则</text>

  <path d="M 820 190 H 840 V 260 H 856" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="860" y="340" width="180" height="70" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="950" y="368" font-size="14" text-anchor="middle" fill="#000000">record 落库</text>
  <text x="950" y="390" font-size="11.5" text-anchor="middle" fill="#666666">SQLite + 图片 + CSV</text>
  <line x1="950" y1="300" x2="950" y2="336" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="40" y="270" font-size="12" fill="#333333">两个消费者互不阻塞：</text>
  <text x="40" y="292" font-size="12" fill="#333333">检测慢只让检测掉帧，</text>
  <text x="40" y="314" font-size="12" fill="#333333">显示帧率不受影响。</text>
  <text x="40" y="336" font-size="11.5" fill="#666666">这条对应质检项目的需求 3.4.8</text>

  <!-- 图例 -->
  <line x1="40" y1="450" x2="80" y2="450" stroke="#000000" stroke-width="1.5"/>
  <text x="88" y="455" font-size="12" fill="#333333">视频帧（会执行）</text>
  <text x="300" y="455" font-size="12" fill="#666666">虚线框没有画：本图只画数据流，控制命令走串口与鼠标</text>
</svg>
