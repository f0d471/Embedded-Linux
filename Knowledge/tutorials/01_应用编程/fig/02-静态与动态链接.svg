<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- 图例 -->
  <rect x="540" y="16" width="400" height="52" fill="white" stroke="black"/>
  <line x1="552" y1="34" x2="576" y2="34" stroke="black"/>
  <text x="582" y="38" font-size="11" font-family="Microsoft YaHei, sans-serif">会执行的通路</text>
  <line x1="700" y1="34" x2="724" y2="34" stroke="black" stroke-dasharray="4 3"/>
  <text x="730" y="38" font-size="11" font-family="Microsoft YaHei, sans-serif">未接入 / 找不到</text>
  <text x="552" y="58" font-size="11" font-family="Microsoft YaHei, sans-serif" fill="#15803d">绿字：跑通</text>
  <text x="660" y="58" font-size="11" font-family="Microsoft YaHei, sans-serif" fill="#b91c1c">红字：失败</text>
  <rect x="770" y="46" width="14" height="12" fill="#dbeafe" stroke="black"/>
  <text x="790" y="58" font-size="11" font-family="Microsoft YaHei, sans-serif">程序</text>

  <!-- 分期边界 -->
  <line x1="490" y1="20" x2="490" y2="470" stroke="black" stroke-dasharray="6 4"/>
  <text x="245" y="40" font-size="13" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">链接期（电脑上，gcc 命令执行时）</text>
  <text x="725" y="92" font-size="13" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">运行期（./xxx 执行时）</text>

  <!-- 静态分支 -->
  <text x="30" y="70" font-size="12" font-family="Consolas, monospace">ar rcs libsub.a sub.o; gcc -o test_static main.o libsub.a</text>
  <rect x="30" y="86" width="110" height="44" fill="white" stroke="black"/>
  <text x="85" y="112" font-size="12" text-anchor="middle" font-family="Consolas, monospace">main.o</text>
  <rect x="30" y="150" width="110" height="44" fill="white" stroke="black"/>
  <text x="85" y="168" font-size="12" text-anchor="middle" font-family="Consolas, monospace">libsub.a</text>
  <text x="85" y="184" font-size="10" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">sub.o 打了包</text>

  <line x1="140" y1="108" x2="218" y2="116" stroke="black"/>
  <polygon points="218,116 209,112 210,120" fill="black"/>
  <line x1="140" y1="172" x2="218" y2="130" stroke="black"/>
  <polygon points="218,130 209,127 211,135" fill="black"/>
  <text x="178" y="96" font-size="10" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">用到的 .o 被拆开抄走</text>

  <rect x="220" y="100" width="90" height="44" fill="#dbeafe" stroke="black"/>
  <text x="265" y="126" font-size="12" text-anchor="middle" font-family="Consolas, monospace">ld</text>

  <line x1="310" y1="122" x2="348" y2="122" stroke="black"/>
  <polygon points="348,122 340,118 340,126" fill="black"/>

  <rect x="350" y="100" width="130" height="44" fill="white" stroke="black"/>
  <text x="415" y="118" font-size="12" text-anchor="middle" font-family="Consolas, monospace">test_static</text>
  <text x="415" y="134" font-size="10" text-anchor="middle" font-family="Consolas, monospace">nm: T sub_func</text>

  <line x1="480" y1="122" x2="548" y2="122" stroke="black"/>
  <polygon points="548,122 540,118 540,126" fill="black"/>
  <rect x="550" y="100" width="180" height="44" fill="white" stroke="black"/>
  <text x="640" y="118" font-size="12" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" fill="#15803d">直接运行</text>
  <text x="640" y="134" font-size="12" text-anchor="middle" font-family="Consolas, monospace" fill="#15803d">打印 sub</text>
  <text x="550" y="166" font-size="10" font-family="Microsoft YaHei, sans-serif">libsub.a 链接完就没用了，删掉它照样跑</text>

  <!-- 动态分支 -->
  <text x="30" y="250" font-size="12" font-family="Consolas, monospace">gcc -shared -fPIC -o libsub.so sub.o; gcc -o test_shared main.o -L. -lsub</text>
  <rect x="30" y="266" width="110" height="44" fill="white" stroke="black"/>
  <text x="85" y="292" font-size="12" text-anchor="middle" font-family="Consolas, monospace">main.o</text>
  <rect x="30" y="330" width="110" height="44" fill="white" stroke="black"/>
  <text x="85" y="348" font-size="12" text-anchor="middle" font-family="Consolas, monospace">libsub.so</text>
  <text x="85" y="364" font-size="10" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">不被抄走</text>

  <line x1="140" y1="288" x2="218" y2="296" stroke="black"/>
  <polygon points="218,296 209,292 210,300" fill="black"/>
  <line x1="140" y1="352" x2="218" y2="310" stroke="black"/>
  <polygon points="218,310 209,307 211,315" fill="black"/>
  <text x="178" y="276" font-size="10" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">只记一笔 NEEDED</text>

  <rect x="220" y="280" width="90" height="44" fill="#dbeafe" stroke="black"/>
  <text x="265" y="306" font-size="12" text-anchor="middle" font-family="Consolas, monospace">ld</text>

  <line x1="310" y1="302" x2="348" y2="302" stroke="black"/>
  <polygon points="348,302 340,298 340,306" fill="black"/>

  <rect x="350" y="280" width="130" height="44" fill="white" stroke="black"/>
  <text x="415" y="298" font-size="12" text-anchor="middle" font-family="Consolas, monospace">test_shared</text>
  <text x="415" y="314" font-size="10" text-anchor="middle" font-family="Consolas, monospace">nm: U sub_func</text>

  <line x1="480" y1="302" x2="548" y2="302" stroke="black"/>
  <polygon points="548,302 540,298 540,306" fill="black"/>

  <rect x="550" y="280" width="150" height="44" fill="#dbeafe" stroke="black"/>
  <text x="625" y="298" font-size="12" text-anchor="middle" font-family="Consolas, monospace">ld.so</text>
  <text x="625" y="314" font-size="10" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">先于 main 运行</text>

  <!-- 运行期找库：失败 -->
  <line x1="700" y1="288" x2="758" y2="220" stroke="black" stroke-dasharray="4 3"/>
  <polygon points="758,220 750,222 754,228" fill="black"/>
  <rect x="760" y="180" width="180" height="44" fill="white" stroke="black"/>
  <text x="850" y="198" font-size="11" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">默认路径（/usr/lib 等）</text>
  <text x="850" y="214" font-size="11" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">没有 libsub.so</text>
  <text x="760" y="246" font-size="11" font-family="Consolas, monospace" fill="#b91c1c">exit 127</text>
  <text x="760" y="262" font-size="10" font-family="Consolas, monospace" fill="#b91c1c">error while loading shared libraries</text>

  <!-- 运行期找库：成功 -->
  <line x1="700" y1="316" x2="758" y2="360" stroke="black"/>
  <polygon points="758,360 749,359 753,352" fill="black"/>
  <rect x="760" y="340" width="180" height="44" fill="white" stroke="black"/>
  <text x="850" y="358" font-size="11" text-anchor="middle" font-family="Consolas, monospace">LD_LIBRARY_PATH=.</text>
  <text x="850" y="374" font-size="11" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">找到 libsub.so</text>
  <line x1="850" y1="384" x2="850" y2="418" stroke="black"/>
  <polygon points="850,418 846,410 854,410" fill="black"/>
  <text x="850" y="440" font-size="12" text-anchor="middle" font-family="Consolas, monospace" fill="#15803d">打印 sub</text>

  <!-- 底部说明 -->
  <text x="30" y="440" font-size="11" font-family="Microsoft YaHei, sans-serif">同一个 libsub.so：链接期只被看一眼名字，运行期才真正被打开。链接时找得到，不代表运行时找得到。</text>
  <text x="30" y="460" font-size="11" font-family="Microsoft YaHei, sans-serif">输出与体积为 2026-10-20 本机实测；本例 sub.c 只有一行代码，两种产物只差 72 字节（6.5 节有 7 倍的对照）。</text>
  <text x="30" y="480" font-size="11" font-family="Microsoft YaHei, sans-serif">内核加载 test_shared 时按 .interp 段先加载 ld.so，再由 ld.so 找 NEEDED 里登记的库（01 篇 3.5 节见过 .interp）。</text>
</svg>
