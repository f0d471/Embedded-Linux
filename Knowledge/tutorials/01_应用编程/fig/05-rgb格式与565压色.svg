<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="330" viewBox="0 0 1050 330" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect x="0" y="0" width="1050" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- RGB888 / xRGB8888 -->
  <text x="60" y="50" font-size="14" fill="#000000">32bpp：xRGB8888（本板 fb0 未插屏时的布局 red=16/8 green=8/8 blue=0/8）</text>
  <g font-size="12" text-anchor="middle">
    <rect x="60"  y="66" width="100" height="34" fill="#ececec" stroke="#999999"/><text x="110" y="88" fill="#777777">X 未用(31..24)</text>
    <rect x="160" y="66" width="130" height="34" fill="#fdecea" stroke="#c62828"/><text x="225" y="88" fill="#b71c1c">R (23..16)</text>
    <rect x="290" y="66" width="130" height="34" fill="#e8f5e9" stroke="#2e7d32"/><text x="355" y="88" fill="#1b5e20">G (15..8)</text>
    <rect x="420" y="66" width="130" height="34" fill="#e3f2fd" stroke="#1565c0"/><text x="485" y="88" fill="#0d47a1">B (7..0)</text>
  </g>
  <text x="60"  y="120" font-size="11.5" fill="#666666">小端内存字节顺序（低地址在前）：</text>
  <g font-size="12" text-anchor="middle">
    <rect x="330" y="104" width="60" height="26" fill="#e3f2fd" stroke="#1565c0"/><text x="360" y="122" fill="#0d47a1">B</text>
    <rect x="390" y="104" width="60" height="26" fill="#e8f5e9" stroke="#2e7d32"/><text x="420" y="122" fill="#1b5e20">G</text>
    <rect x="450" y="104" width="60" height="26" fill="#fdecea" stroke="#c62828"/><text x="480" y="122" fill="#b71c1c">R</text>
    <rect x="510" y="104" width="60" height="26" fill="#ececec" stroke="#999999"/><text x="540" y="122" fill="#777777">X</text>
  </g>
  <text x="600" y="122" font-size="12" fill="#333333">← 整数 0x00RRGGBB 写进去,文件里看到 B G R X(04 章小端)</text>

  <!-- 888 压成 565 的取位 -->
  <text x="60" y="170" font-size="14" fill="#000000">压成 RGB565（插上 HDMI 后本板变为 16bpp：red=11/5 green=5/6 blue=0/5）——各取高位</text>
  <g font-size="11.5">
    <rect x="60"  y="186" width="220" height="30" fill="#fdecea" stroke="#c62828"/>
    <text x="70" y="206" fill="#b71c1c">R888: R7 R6 R5 R4 R3 R2 R1 R0</text>
    <rect x="300" y="186" width="120" height="30" fill="#ffffff" stroke="#c62828" stroke-dasharray="4 3"/>
    <text x="308" y="206" fill="#b71c1c">R4 R3 R2 R1 R0 →</text>
    <rect x="430" y="186" width="100" height="30" fill="#fdecea" stroke="#c62828"/>
    <text x="440" y="206" fill="#b71c1c">565 的 R(14..10)</text>
  </g>
  <g font-size="11.5">
    <rect x="60"  y="226" width="220" height="30" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="70" y="246" fill="#1b5e20">G888: G7 G6 G5 G4 G3 G2 G1 G0</text>
    <rect x="300" y="226" width="120" height="30" fill="#ffffff" stroke="#2e7d32" stroke-dasharray="4 3"/>
    <text x="308" y="246" fill="#1b5e20">G5 G4 G3 G2 G1 G0 →</text>
    <rect x="430" y="226" width="100" height="30" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="440" y="246" fill="#1b5e20">565 的 G(9..4)</text>
  </g>
  <g font-size="11.5">
    <rect x="60"  y="266" width="220" height="30" fill="#e3f2fd" stroke="#1565c0"/>
    <text x="70" y="286" fill="#0d47a1">B888: B7 B6 B5 B4 B3 B2 B1 B0</text>
    <rect x="300" y="266" width="120" height="30" fill="#ffffff" stroke="#1565c0" stroke-dasharray="4 3"/>
    <text x="308" y="286" fill="#0d47a1">B4 B3 B2 B1 B0 →</text>
    <rect x="430" y="266" width="100" height="30" fill="#e3f2fd" stroke="#1565c0"/>
    <text x="440" y="286" fill="#0d47a1">565 的 B(4..0)</text>
  </g>
  <text x="580" y="206" font-size="12.5" fill="#333333">红:(color &gt;&gt; 16 &amp; 0xff) &gt;&gt; 3 再 &lt;&lt; 11</text>
  <text x="580" y="228" font-size="12.5" fill="#333333">绿:(color &gt;&gt; 8 &amp; 0xff) &gt;&gt; 2 再 &lt;&lt; 5(绿多 1 位:人眼对绿最敏感)</text>
  <text x="580" y="250" font-size="12.5" fill="#333333">蓝:(color &amp; 0xff) &gt;&gt; 3</text>
  <text x="580" y="284" font-size="12" fill="#666666">箭头(虚线框) = 丢弃的低位。888 共 16777216 色,565 只剩 65536 色</text>

  <!-- 图例 -->
  <text x="60" y="318" font-size="12" fill="#333333">框的颜色 = 颜色分量(红/绿/蓝),灰 = 不使用;实线 = 保留下来的位,虚线 = 被丢弃的位</text>
</svg>
