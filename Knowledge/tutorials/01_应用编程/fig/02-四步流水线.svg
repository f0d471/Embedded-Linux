<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500">
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- 程序行 -->
  <rect x="20" y="30" width="120" height="44" fill="#dbeafe" stroke="black"/>
  <text x="80" y="48" font-size="13" text-anchor="middle" font-family="Consolas, monospace">gcc</text>
  <text x="80" y="66" font-size="11" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">驱动，自己不翻译</text>

  <rect x="230" y="30" width="200" height="44" fill="#dbeafe" stroke="black"/>
  <text x="330" y="48" font-size="13" text-anchor="middle" font-family="Consolas, monospace">cc1</text>
  <text x="330" y="66" font-size="11" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">预处理 + 编译</text>

  <rect x="520" y="30" width="130" height="44" fill="#dbeafe" stroke="black"/>
  <text x="585" y="48" font-size="13" text-anchor="middle" font-family="Consolas, monospace">as</text>
  <text x="585" y="66" font-size="11" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">汇编</text>

  <rect x="720" y="30" width="210" height="44" fill="#dbeafe" stroke="black"/>
  <text x="825" y="48" font-size="13" text-anchor="middle" font-family="Consolas, monospace">collect2（调用 ld）</text>
  <text x="825" y="66" font-size="11" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">链接</text>

  <!-- 调用关系（虚线） -->
  <polyline points="140,52 180,52 180,20 330,20 330,30" fill="none" stroke="black" stroke-dasharray="4 3"/>
  <polyline points="140,52 585,52 585,30" fill="none" stroke="black" stroke-dasharray="4 3"/>
  <polyline points="140,52 690,52 690,20 825,20 825,30" fill="none" stroke="black" stroke-dasharray="4 3"/>

  <!-- 程序到工序的连接（虚线） -->
  <line x1="280" y1="74" x2="177" y2="182" stroke="black" stroke-dasharray="4 3"/>
  <line x1="380" y1="74" x2="362" y2="182" stroke="black" stroke-dasharray="4 3"/>
  <line x1="585" y1="74" x2="547" y2="182" stroke="black" stroke-dasharray="4 3"/>
  <line x1="790" y1="74" x2="732" y2="182" stroke="black" stroke-dasharray="4 3"/>

  <!-- 文件行 -->
  <rect x="30" y="184" width="120" height="52" fill="white" stroke="black"/>
  <text x="90" y="206" font-size="13" text-anchor="middle" font-family="Consolas, monospace">hello.c</text>
  <text x="90" y="224" font-size="11" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">19 行</text>

  <rect x="215" y="184" width="120" height="52" fill="white" stroke="black"/>
  <text x="275" y="206" font-size="13" text-anchor="middle" font-family="Consolas, monospace">hello.i</text>
  <text x="275" y="224" font-size="11" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">848 行，仍是 C</text>

  <rect x="400" y="184" width="120" height="52" fill="white" stroke="black"/>
  <text x="460" y="206" font-size="13" text-anchor="middle" font-family="Consolas, monospace">hello.s</text>
  <text x="460" y="224" font-size="11" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">63 行汇编</text>

  <rect x="585" y="184" width="120" height="52" fill="white" stroke="black"/>
  <text x="645" y="206" font-size="13" text-anchor="middle" font-family="Consolas, monospace">hello.o</text>
  <text x="645" y="224" font-size="11" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">1640 字节机器码</text>

  <rect x="770" y="184" width="120" height="52" fill="white" stroke="black"/>
  <text x="830" y="206" font-size="13" text-anchor="middle" font-family="Consolas, monospace">hello</text>
  <text x="830" y="224" font-size="11" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">15992 字节，可执行</text>

  <!-- 工序箭头 -->
  <line x1="150" y1="210" x2="212" y2="210" stroke="black"/>
  <polygon points="212,210 204,206 204,214" fill="black"/>
  <text x="181" y="170" font-size="11" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">1 预处理</text>
  <text x="181" y="256" font-size="11" text-anchor="middle" font-family="Consolas, monospace">-E</text>
  <text x="181" y="271" font-size="10" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">停在这</text>

  <line x1="335" y1="210" x2="397" y2="210" stroke="black"/>
  <polygon points="397,210 389,206 389,214" fill="black"/>
  <text x="366" y="170" font-size="11" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">2 编译</text>
  <text x="366" y="256" font-size="11" text-anchor="middle" font-family="Consolas, monospace">-S</text>
  <text x="366" y="271" font-size="10" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">停在这</text>

  <line x1="520" y1="210" x2="582" y2="210" stroke="black"/>
  <polygon points="582,210 574,206 574,214" fill="black"/>
  <text x="551" y="170" font-size="11" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">3 汇编</text>
  <text x="551" y="256" font-size="11" text-anchor="middle" font-family="Consolas, monospace">-c</text>
  <text x="551" y="271" font-size="10" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">停在这</text>

  <line x1="705" y1="210" x2="767" y2="210" stroke="black"/>
  <polygon points="767,210 759,206 759,214" fill="black"/>
  <text x="736" y="170" font-size="11" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">4 链接</text>

  <!-- 链接的额外输入 -->
  <rect x="470" y="310" width="230" height="52" fill="white" stroke="black"/>
  <text x="585" y="330" font-size="11" text-anchor="middle" font-family="Consolas, monospace">Scrt1.o crti.o crtbeginS.o</text>
  <text x="585" y="346" font-size="11" text-anchor="middle" font-family="Consolas, monospace">crtendS.o crtn.o</text>
  <text x="585" y="360" font-size="10" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">启动文件，你没写，gcc 自动加</text>

  <rect x="740" y="310" width="190" height="52" fill="white" stroke="black"/>
  <text x="835" y="332" font-size="12" text-anchor="middle" font-family="Consolas, monospace">-lgcc -lc</text>
  <text x="835" y="350" font-size="10" text-anchor="middle" font-family="Microsoft YaHei, sans-serif">默认库，也是自动加</text>

  <line x1="650" y1="310" x2="720" y2="214" stroke="black"/>
  <polygon points="720,214 712,218 715,222" fill="black"/>
  <line x1="800" y1="310" x2="745" y2="214" stroke="black"/>
  <polygon points="745,214 738,219 742,222" fill="black"/>

  <!-- 底部说明 -->
  <text x="30" y="408" font-size="11" font-family="Microsoft YaHei, sans-serif">四个步骤是逻辑划分；实际干活的是 cc1、as、collect2 三个程序，cc1 一个干前两步。</text>
  <text x="30" y="428" font-size="11" font-family="Microsoft YaHei, sans-serif">一条 gcc 命令走全程时，中间产物写在 /tmp 下，用完即删；加 -save-temps 可以留下来对照。</text>
  <text x="30" y="448" font-size="11" font-family="Microsoft YaHei, sans-serif">行数与字节数为 2026-10-20 本机实测（hello.c 即 01 篇的那份）。</text>

  <!-- 图例 -->
  <rect x="20" y="462" width="560" height="30" fill="white" stroke="black"/>
  <rect x="30" y="471" width="14" height="12" fill="#dbeafe" stroke="black"/>
  <text x="50" y="481" font-size="11" font-family="Microsoft YaHei, sans-serif">程序（会被执行）</text>
  <rect x="170" y="471" width="14" height="12" fill="white" stroke="black"/>
  <text x="190" y="481" font-size="11" font-family="Microsoft YaHei, sans-serif">文件（数据）</text>
  <line x1="290" y1="477" x2="314" y2="477" stroke="black"/>
  <text x="320" y="481" font-size="11" font-family="Microsoft YaHei, sans-serif">数据流</text>
  <line x1="400" y1="477" x2="424" y2="477" stroke="black" stroke-dasharray="4 3"/>
  <text x="430" y="481" font-size="11" font-family="Microsoft YaHei, sans-serif">gcc 调用谁 / 谁干这步</text>
</svg>
