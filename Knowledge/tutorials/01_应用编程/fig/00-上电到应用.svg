<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="452" viewBox="0 0 1400 452" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect x="0" y="0" width="1400" height="452" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>

  <text x="40" y="38" font-size="17" fill="#000000">从按下电源，到你的程序在板上跑起来</text>
  <text x="40" y="62" font-size="12" fill="#666666">同一块 eMMC 里存着前四环；本阶段（应用编程 01～11 篇）只改最右边两格</text>

  <!-- 本阶段范围（蓝色括号在阶段框上方） -->
  <path d="M 1055 92 V 84 H 1275 V 92" fill="none" stroke="#1565c0" stroke-width="1.4"/>
  <text x="1165" y="78" font-size="11.5" text-anchor="middle" fill="#1565c0">本阶段只改这两格</text>

  <!-- 六个阶段框 -->
  <rect x="40" y="100" width="190" height="74" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="135" y="130" font-size="15" text-anchor="middle" fill="#000000">电源 / 复位</text>
  <text x="135" y="152" font-size="11.5" text-anchor="middle" fill="#666666">板子通电，SoC 开始执行</text>

  <rect x="270" y="100" width="190" height="74" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="365" y="130" font-size="15" text-anchor="middle" fill="#000000">BootROM</text>
  <text x="365" y="152" font-size="11.5" text-anchor="middle" fill="#666666">SoC 内固化的第一段代码</text>

  <rect x="500" y="100" width="190" height="74" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="595" y="130" font-size="15" text-anchor="middle" fill="#000000">u-boot</text>
  <text x="595" y="152" font-size="11.5" text-anchor="middle" fill="#666666">读内核与设备树进内存</text>

  <rect x="730" y="100" width="190" height="74" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="825" y="130" font-size="15" text-anchor="middle" fill="#000000">内核 + 设备树</text>
  <text x="825" y="152" font-size="11.5" text-anchor="middle" fill="#666666">认外设，挂上 rootfs</text>

  <rect x="960" y="100" width="190" height="74" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="1055" y="130" font-size="15" text-anchor="middle" fill="#000000">rootfs / init</text>
  <text x="1055" y="152" font-size="11.5" text-anchor="middle" fill="#666666">拉起第一个用户态程序</text>

  <rect x="1190" y="100" width="170" height="74" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.8"/>
  <text x="1275" y="130" font-size="15" text-anchor="middle" fill="#0d47a1">你的应用</text>
  <text x="1275" y="152" font-size="11.5" text-anchor="middle" fill="#0d47a1">在 shell 里敲的那一个</text>

  <!-- 阶段箭头 -->
  <line x1="230" y1="137" x2="266" y2="137" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="460" y1="137" x2="496" y2="137" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="690" y1="137" x2="726" y2="137" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="920" y1="137" x2="956" y2="137" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="1150" y1="137" x2="1186" y2="137" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 介质说明 -->
  <text x="135" y="196" font-size="11.5" text-anchor="middle" fill="#333333">5V 适配器供电</text>
  <text x="365" y="196" font-size="11.5" text-anchor="middle" fill="#333333">SoC 内部，改不了</text>
  <text x="595" y="196" font-size="11.5" text-anchor="middle" fill="#333333">eMMC 里</text>
  <text x="825" y="196" font-size="11.5" text-anchor="middle" fill="#333333">eMMC 里</text>
  <text x="1055" y="196" font-size="11.5" text-anchor="middle" fill="#333333">eMMC 里</text>
  <text x="1275" y="196" font-size="11.5" text-anchor="middle" fill="#333333">eMMC 里，或临时上传</text>

  <!-- 坏了会怎样 -->
  <text x="40" y="238" font-size="12" fill="#b71c1c">这一环坏了的典型现象（串口上看到的）：</text>

  <rect x="40" y="252" width="190" height="86" fill="#ffffff" stroke="#c62828" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="135" y="276" font-size="12" text-anchor="middle" fill="#b71c1c">什么也不发生</text>
  <text x="135" y="296" font-size="11" text-anchor="middle" fill="#b71c1c">先查供电和串口线，</text>
  <text x="135" y="312" font-size="11" text-anchor="middle" fill="#b71c1c">不是程序的问题</text>

  <rect x="270" y="252" width="190" height="86" fill="#ffffff" stroke="#c62828" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="365" y="276" font-size="12" text-anchor="middle" fill="#b71c1c">串口一个字都没有</text>
  <text x="365" y="296" font-size="11" text-anchor="middle" fill="#b71c1c">或只跳出几个 ROM 字符</text>
  <text x="365" y="312" font-size="11" text-anchor="middle" fill="#b71c1c">存储里的引导坏了</text>

  <rect x="500" y="252" width="190" height="86" fill="#ffffff" stroke="#c62828" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="595" y="276" font-size="12" text-anchor="middle" fill="#b71c1c">停在 U-Boot 提示符</text>
  <text x="595" y="296" font-size="11" text-anchor="middle" fill="#b71c1c">内核没被读起来</text>
  <text x="595" y="312" font-size="11" text-anchor="middle" fill="#b71c1c">（bootargs / 镜像路径）</text>

  <rect x="730" y="252" width="190" height="86" fill="#ffffff" stroke="#c62828" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="825" y="276" font-size="12" text-anchor="middle" fill="#b71c1c">停在 Starting kernel</text>
  <text x="825" y="296" font-size="11" text-anchor="middle" fill="#b71c1c">或 kernel panic</text>
  <text x="825" y="312" font-size="11" text-anchor="middle" fill="#b71c1c">卡 rootfs 挂不上</text>

  <rect x="960" y="252" width="190" height="86" fill="#ffffff" stroke="#c62828" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="1055" y="276" font-size="12" text-anchor="middle" fill="#b71c1c">内核日志末尾停住</text>
  <text x="1055" y="296" font-size="11" text-anchor="middle" fill="#b71c1c">或 /bin/sh 起不来</text>
  <text x="1055" y="312" font-size="11" text-anchor="middle" fill="#b71c1c">登录提示出不来</text>

  <rect x="1190" y="252" width="170" height="86" fill="#ffffff" stroke="#c62828" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="1275" y="276" font-size="12" text-anchor="middle" fill="#b71c1c">shell 还在</text>
  <text x="1275" y="296" font-size="11" text-anchor="middle" fill="#b71c1c">只是你的程序报错退出</text>
  <text x="1275" y="312" font-size="11" text-anchor="middle" fill="#b71c1c">这是好消息</text>

  <!-- 图例 -->
  <rect x="40" y="392" width="16" height="16" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2"/>
  <text x="64" y="405" font-size="12" fill="#333333">应用层，你写的东西</text>
  <line x1="250" y1="400" x2="290" y2="400" stroke="#000000" stroke-width="1.5"/>
  <text x="296" y="405" font-size="12" fill="#333333">上电后依次发生（实线）</text>
  <rect x="500" y="392" width="16" height="16" fill="#ffffff" stroke="#c62828" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="524" y="405" font-size="12" fill="#333333">坏了的现象，不是流程（虚线框）</text>
</svg>
