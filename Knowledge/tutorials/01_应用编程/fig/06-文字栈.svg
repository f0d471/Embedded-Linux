<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#000"/></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f5fbf"/></marker>
    <marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#000"/></marker>
  </defs>
  <style>
    .t{font-family:"Microsoft YaHei, sans-serif";font-size:13px;fill:#000}
    .h{font-family:"Microsoft YaHei, sans-serif";font-size:14px;font-weight:bold;fill:#000}
    .s{font-family:"Microsoft YaHei, sans-serif";font-size:11px;fill:#444}
    .c{font-family:"Consolas, monospace";font-size:11px;fill:#000}
    .box{fill:#fff;stroke:#000;stroke-width:1.2}
    .band{fill:none;stroke:#888;stroke-width:1}
    .ln{stroke:#000;stroke-width:1.3;fill:none;marker-end:url(#a)}
    .rej{stroke:#000;stroke-width:1.3;fill:none;stroke-dasharray:5,4;marker-end:url(#r)}
    .ver{stroke:#1f5fbf;stroke-width:1.5;fill:none;marker-end:url(#b)}
    .sep{stroke:#aaa;stroke-width:1}
  </style>
  <rect width="960" height="640" fill="#fff"/>

  <!-- build time -->
  <rect class="band" x="10" y="10" width="940" height="190"/>
  <text class="h" x="20" y="32">构建期：电脑（WSL，x86_64），第 4 节</text>
  <rect class="box" x="20" y="50" width="200" height="50"/>
  <text class="c" x="30" y="72">freetype-2.10.2.tar.xz</text>
  <text class="s" x="30" y="90">~/deps/ 里的源码包</text>
  <rect class="box" x="255" y="50" width="210" height="50"/>
  <text class="c" x="265" y="70">configure</text>
  <text class="c" x="265" y="88">--host=arm-linux-gnueabihf</text>
  <rect class="box" x="490" y="50" width="210" height="50"/>
  <text class="c" x="500" y="70">make</text>
  <text class="c" x="500" y="88">make DESTDIR=$STAGE install</text>
  <rect class="box" x="725" y="50" width="215" height="50"/>
  <text class="c" x="735" y="70">$STAGE/usr/include/freetype2</text>
  <text class="c" x="735" y="88">$STAGE/usr/lib/libfreetype.a</text>
  <path class="ln" d="M220,75 L253,75"/>
  <path class="ln" d="M465,75 L488,75"/>
  <path class="ln" d="M700,75 L723,75"/>

  <rect class="box" x="255" y="130" width="210" height="50"/>
  <text class="c" x="265" y="152">fbtext.c</text>
  <text class="s" x="265" y="170">本章的上板程序源码</text>
  <rect class="box" x="490" y="130" width="210" height="50"/>
  <text class="c" x="500" y="150">arm-linux-gnueabihf-gcc -static</text>
  <text class="c" x="500" y="168">-I  -L  -lfreetype</text>
  <rect class="box" x="725" y="130" width="215" height="50"/>
  <text class="c" x="735" y="150">fbtext-arm</text>
  <text class="c" x="735" y="168">ARM EABI5, statically linked</text>
  <path class="ln" d="M465,155 L488,155"/>
  <path class="ln" d="M700,155 L723,155"/>
  <path class="ln" d="M832,100 L832,115 L640,115 L640,128"/>

  <path class="ln" d="M832,180 L832,226"/>
  <text class="s" x="822" y="214" text-anchor="end">串口分块校验上传（7.4 节）</text>

  <!-- run time -->
  <rect class="band" x="10" y="230" width="940" height="400"/>
  <text class="h" x="20" y="252">运行期：板子（i.MX6ULL，Linux 4.9.88），第 5～7 节</text>
  <text class="s" x="20" y="272">用户态：fbtext-arm 进程</text>

  <line class="sep" x1="242" y1="262" x2="242" y2="485"/>
  <line class="sep" x1="477" y1="262" x2="477" y2="485"/>
  <line class="sep" x1="712" y1="262" x2="712" y2="485"/>
  <text class="s" x="248" y="272">编码边界</text>
  <text class="s" x="483" y="272">字体边界</text>
  <text class="s" x="718" y="272">显示边界</text>

  <!-- col1 encoding -->
  <rect class="box" x="20" y="285" width="210" height="50"/>
  <text class="c" x="30" y="305">argv[3]  UTF-8 bytes</text>
  <text class="c" x="30" y="323">41 e4 b8 ad 67</text>
  <rect class="box" x="20" y="360" width="210" height="50"/>
  <text class="c" x="30" y="380">decode_one</text>
  <text class="c" x="30" y="398">uint32_t cp: U+0041 U+4E2D</text>
  <rect class="box" x="20" y="435" width="210" height="45" stroke-dasharray="5,4"/>
  <text class="c" x="30" y="455">bad UTF-8 at byte N</text>
  <text class="c" x="30" y="471">exit 1</text>
  <path class="ln" d="M125,335 L125,358"/>
  <path class="rej" d="M125,410 L125,433"/>
  <text class="s" x="132" y="427">第 1 节</text>

  <!-- col2 font -->
  <rect class="box" x="255" y="285" width="210" height="50"/>
  <text class="c" x="265" y="305">FT_New_Face</text>
  <text class="c" x="265" y="323">simsun.ttc / msyh.ttc</text>
  <rect class="box" x="255" y="360" width="210" height="50"/>
  <text class="c" x="265" y="380">FT_Get_Char_Index: gid</text>
  <text class="c" x="265" y="398">FT_Load_Char(FT_LOAD_RENDER)</text>
  <rect class="box" x="255" y="435" width="210" height="45"/>
  <text class="c" x="265" y="454">FT_Bitmap: width rows pitch</text>
  <text class="c" x="265" y="471">coverage 0..255, advance.x</text>
  <path class="ln" d="M230,385 L253,385"/>
  <path class="ln" d="M360,335 L360,358"/>
  <path class="ln" d="M360,410 L360,433"/>

  <!-- col3 layout + blend -->
  <rect class="box" x="490" y="435" width="210" height="45"/>
  <text class="c" x="500" y="454">dx = pen/64 + bitmap_left</text>
  <text class="c" x="500" y="471">dy = baseline - bitmap_top</text>
  <rect class="box" x="490" y="360" width="210" height="50"/>
  <text class="c" x="500" y="380">put_coverage</text>
  <text class="c" x="500" y="398">load_pixel, field_to_8, blend</text>
  <rect class="box" x="490" y="285" width="210" height="50"/>
  <text class="c" x="500" y="305">pen += advance.x</text>
  <text class="s" x="500" y="323">26.6 原样累加（6.2 节）</text>
  <path class="ln" d="M465,457 L488,457"/>
  <path class="ln" d="M595,435 L595,412"/>
  <path class="ln" d="M520,435 L520,420 L470,420 L470,310 L488,310"/>

  <!-- col4 pack -->
  <rect class="box" x="725" y="360" width="215" height="50"/>
  <text class="c" x="735" y="380">eight_to_field</text>
  <text class="c" x="735" y="398">store_pixel</text>
  <rect class="box" x="725" y="435" width="215" height="45"/>
  <text class="c" x="735" y="454">mmap of /dev/fb0</text>
  <text class="c" x="735" y="471">var / fix from ioctl</text>
  <path class="ln" d="M700,385 L723,385"/>
  <path class="ln" d="M832,410 L832,433"/>

  <!-- kernel / hardware -->
  <line class="sep" x1="10" y1="500" x2="950" y2="500"/>
  <text class="s" x="20" y="518">内核驱动与硬件</text>
  <rect class="box" x="725" y="530" width="215" height="45"/>
  <text class="c" x="735" y="550">framebuffer memory</text>
  <text class="c" x="735" y="567">LCDIF scans it</text>
  <rect class="box" x="490" y="530" width="210" height="45"/>
  <text class="c" x="500" y="550">HDMI screen</text>
  <text class="s" x="500" y="567">05 篇</text>
  <path class="ln" d="M832,480 L832,528"/>
  <path class="ln" d="M725,552 L702,552"/>

  <rect class="box" x="255" y="530" width="210" height="45"/>
  <text class="c" x="265" y="550">dd if=/dev/fb0 -&gt; rawcheck</text>
  <text class="s" x="265" y="567">独立核对，不经过 FreeType（7.3、7.6 节）</text>
  <path class="ver" d="M880,575 L880,595 L360,595 L360,577"/>

  <!-- legend -->
  <line x1="20" y1="612" x2="60" y2="612" stroke="#000" stroke-width="1.3"/>
  <text class="s" x="66" y="616">会执行的通路</text>
  <line x1="170" y1="612" x2="210" y2="612" stroke="#000" stroke-width="1.3" stroke-dasharray="5,4"/>
  <text class="s" x="216" y="616">被拒绝的通路</text>
  <line x1="320" y1="612" x2="360" y2="612" stroke="#1f5fbf" stroke-width="1.5"/>
  <text class="s" x="366" y="616">蓝色：独立核对的读回路径</text>
  <line x1="530" y1="612" x2="570" y2="612" stroke="#aaa" stroke-width="1"/>
  <text class="s" x="576" y="616">灰色竖线：8.1 节的三条边界</text>
</svg>
