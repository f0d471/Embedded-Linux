<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#333"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c0392b"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Microsoft YaHei", sans-serif; fill: #222; }
    .code { font-family: Consolas, monospace; }
    .t { font-size: 18px; font-weight: bold; }
    .h { font-size: 13px; font-weight: bold; }
    .b { font-size: 12px; }
    .s { font-size: 11px; fill: #555; }
    .lb { font-size: 11px; fill: #333; }
    .lbr { font-size: 11px; fill: #c0392b; }
    rect.box { fill: #fff; stroke: #333; stroke-width: 1.2; }
    rect.pan { fill: #fafafa; stroke: #999; stroke-width: 1; }
    line.div { stroke: #333; stroke-width: 1; }
    path.w { fill: none; stroke: #333; stroke-width: 1.4; }
    path.wr { fill: none; stroke: #c0392b; stroke-width: 1.6; }
    path.dash { fill: none; stroke: #666; stroke-width: 1.2; stroke-dasharray: 5,4; }
  </style>

  <rect x="0" y="0" width="1040" height="700" fill="#fff"/>
  <text class="t" x="24" y="34">延迟绑定：链接时记待办，第一次调用填格子</text>
  <text class="s" x="24" y="56">左：链接器一个字节不抄，只写记录。右：运行时第一次调用绕路回填，第二次直达。</text>

  <!-- ================= 左面板：链接时 ================= -->
  <rect class="pan" x="20" y="72" width="330" height="600"/>
  <text class="h" x="36" y="96">链接时（开发机）</text>

  <rect class="box" x="40" y="112" width="290" height="120"/>
  <text class="h" x="56" y="136">ld 链接器</text>
  <text class="b" x="56" y="160">app.o 欠账：U mx_add</text>
  <text class="b" x="56" y="182">libmathx.so 提供：T mx_add</text>
  <text class="b" x="56" y="204">决定：不抄实现</text>

  <path class="w" d="M185,232 L185,268" marker-end="url(#ar)"/>
  <text class="s" x="196" y="256">只记三笔账</text>

  <rect class="box" x="40" y="268" width="290" height="220"/>
  <text class="h" x="56" y="292">app_lazy（产物）</text>
  <text class="code b" x="56" y="320">NEEDED libmathx.so</text>
  <text class="code b" x="56" y="348">.rela.plt: 0x4008 ← mx_add</text>
  <text class="s" x="72" y="368">（待办清单，Sym.Value = 0）</text>
  <text class="code b" x="56" y="396">.got 0x4008 初值 = 0x1020</text>
  <text class="s" x="72" y="416">（0x1020 = .plt 开头 PLT0）</text>
  <text class="code b" x="56" y="444">.plt.sec: jmp *0x4008(%rip)</text>

  <path class="dash" d="M185,488 L185,524"/>
  <text class="s" x="196" y="512">实现仍留在库里</text>

  <rect class="box" x="40" y="524" width="290" height="128"/>
  <text class="h" x="56" y="550">libmathx.so</text>
  <text class="code b" x="56" y="578">T mx_add</text>
  <text class="s" x="56" y="606">多个进程共享同一份代码，</text>
  <text class="s" x="56" y="626">装入地址由 ld.so 现挑</text>

  <!-- ================= 右面板：运行时 ================= -->
  <rect class="pan" x="370" y="72" width="646" height="600"/>
  <text class="h" x="386" y="96">运行时（目标机）</text>

  <rect class="box" x="390" y="116" width="210" height="56"/>
  <text class="h" x="404" y="140">main</text>
  <text class="code s" x="404" y="162">printf("...%d", mx_add(3,4))</text>

  <path class="wr" d="M495,172 L495,204" marker-end="url(#arr)"/>
  <text class="lbr" x="505" y="194">① 调 mx_add</text>

  <rect class="box" x="390" y="204" width="210" height="72"/>
  <text class="h" x="404" y="226">.plt.sec 0x1070</text>
  <text class="code s" x="404" y="248">jmp *0x4008(%rip)</text>
  <text class="s" x="404" y="266">跳板：取格子里的值跳</text>

  <path class="wr" d="M495,276 L495,308" marker-end="url(#arr)"/>
  <text class="lbr" x="505" y="298">②</text>

  <rect class="box" x="390" y="308" width="210" height="96"/>
  <text class="h" x="404" y="332">.got 格子 0x4008</text>
  <text class="code s" x="404" y="354">第一次：0x1020</text>
  <text class="code s" x="404" y="372">回填后：真地址</text>
  <text class="s" x="404" y="392">可写（WA 段）</text>

  <path class="wr" d="M495,404 L495,436" marker-end="url(#arr)"/>
  <text class="lbr" x="505" y="426">③ 初值=PLT0</text>

  <rect class="box" x="390" y="436" width="210" height="110"/>
  <text class="h" x="404" y="460">.plt 0x1020（PLT0）</text>
  <text class="code s" x="404" y="482">push GOT[1]</text>
  <text class="code s" x="404" y="502">jmp *GOT[2]</text>
  <text class="s" x="404" y="524">GOT[2] 在启动时已被</text>
  <text class="s" x="404" y="540">ld.so 填成解析函数入口</text>

  <path class="wr" d="M600,490 L630,490" marker-end="url(#arr)"/>
  <text class="lbr" x="602" y="482">④</text>

  <rect class="box" x="630" y="436" width="190" height="120"/>
  <text class="h" x="644" y="460">ld.so 解析函数</text>
  <text class="s" x="644" y="484">按 .rela.plt 序号：</text>
  <text class="code s" x="644" y="504">0x4008 ← mx_add</text>
  <text class="s" x="644" y="528">到 libmathx.so 的</text>
  <text class="s" x="644" y="544">.dynsym 里查地址</text>

  <path class="wr" d="M806,436 L846,346" marker-end="url(#arr)"/>
  <text class="lbr" x="744" y="424">⑤ 查表</text>

  <rect class="box" x="848" y="300" width="164" height="128"/>
  <text class="h" x="860" y="322">libmathx.so</text>
  <text class="code s" x="860" y="344">.dynsym:</text>
  <text class="code s" x="860" y="360">  T mx_add</text>
  <line class="div" x1="848" y1="372" x2="1012" y2="372"/>
  <text class="s" x="860" y="392">.text:</text>
  <text class="code s" x="860" y="410">  mx_add 真身</text>

  <path class="wr" d="M630,510 L610,510 L610,356 L606,356" marker-end="url(#arr)"/>
  <text class="lbr" x="612" y="472">⑥</text>

  <path class="wr" d="M822,550 L848,414" marker-end="url(#arr)"/>
  <text class="lbr" x="852" y="490">⑦ 跳进 mx_add</text>

  <rect class="box" x="390" y="596" width="622" height="60"/>
  <text class="h" x="404" y="618">第二次调用（无红线）</text>
  <text class="s" x="404" y="640">main → .plt.sec → jmp *0x4008(%rip) → 格子里已是真地址 → 直达 mx_add</text>

  <!-- 图例 -->
  <text class="lbr" x="24" y="680">红线①～⑦：第一次调用才走的绕路。④ 进解析函数，⑤ 查 .dynsym，⑥ 回填格子，⑦ 跳进 mx_add。</text>
  <text class="s" x="620" y="680">实线=会执行的通路；虚线=链接时记下的待办（未接通）。</text>
</svg>
