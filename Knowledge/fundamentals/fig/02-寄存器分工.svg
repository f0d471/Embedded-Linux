<svg xmlns="http://www.w3.org/2000/svg" width="980" height="700" viewBox="0 0 980 700" font-family="Microsoft YaHei, sans-serif">
<rect x="0" y="0" width="980" height="700" fill="#ffffff"/>
<text x="40" y="34" font-size="16" fill="#000000">ARM 32 位寄存器组与 AAPCS 分工</text>
<text x="50" y="66" font-size="13" fill="#000000">通用寄存器（16 个，各 32 位，所有函数共用）</text>
<rect x="50" y="78" width="430" height="28" fill="#ffffff" stroke="#c62828" stroke-width="1.6"/>
<text x="62" y="97" font-size="12.5" fill="#000000" font-family="Consolas, monospace">r0</text>
<text x="116" y="97" font-size="12.5" fill="#000000" font-family="Consolas, monospace">a1</text>
<text x="196" y="97" font-size="12" fill="#333333">第 1 个参数；返回值</text>
<rect x="50" y="108" width="430" height="28" fill="#ffffff" stroke="#c62828" stroke-width="1.6"/>
<text x="62" y="127" font-size="12.5" fill="#000000" font-family="Consolas, monospace">r1</text>
<text x="116" y="127" font-size="12.5" fill="#000000" font-family="Consolas, monospace">a2</text>
<text x="196" y="127" font-size="12" fill="#333333">第 2 个参数；64 位返回值高 32 位</text>
<rect x="50" y="138" width="430" height="28" fill="#ffffff" stroke="#c62828" stroke-width="1.6"/>
<text x="62" y="157" font-size="12.5" fill="#000000" font-family="Consolas, monospace">r2</text>
<text x="116" y="157" font-size="12.5" fill="#000000" font-family="Consolas, monospace">a3</text>
<text x="196" y="157" font-size="12" fill="#333333">第 3 个参数</text>
<rect x="50" y="168" width="430" height="28" fill="#ffffff" stroke="#c62828" stroke-width="1.6"/>
<text x="62" y="187" font-size="12.5" fill="#000000" font-family="Consolas, monospace">r3</text>
<text x="116" y="187" font-size="12.5" fill="#000000" font-family="Consolas, monospace">a4</text>
<text x="196" y="187" font-size="12" fill="#333333">第 4 个参数</text>
<rect x="50" y="198" width="430" height="28" fill="#ffffff" stroke="#1565c0" stroke-width="1.6"/>
<text x="62" y="217" font-size="12.5" fill="#000000" font-family="Consolas, monospace">r4</text>
<text x="116" y="217" font-size="12.5" fill="#000000" font-family="Consolas, monospace">v1</text>
<text x="196" y="217" font-size="12" fill="#333333">局部变量</text>
<rect x="50" y="228" width="430" height="28" fill="#ffffff" stroke="#1565c0" stroke-width="1.6"/>
<text x="62" y="247" font-size="12.5" fill="#000000" font-family="Consolas, monospace">r5</text>
<text x="116" y="247" font-size="12.5" fill="#000000" font-family="Consolas, monospace">v2</text>
<text x="196" y="247" font-size="12" fill="#333333">局部变量</text>
<rect x="50" y="258" width="430" height="28" fill="#ffffff" stroke="#1565c0" stroke-width="1.6"/>
<text x="62" y="277" font-size="12.5" fill="#000000" font-family="Consolas, monospace">r6</text>
<text x="116" y="277" font-size="12.5" fill="#000000" font-family="Consolas, monospace">v3</text>
<text x="196" y="277" font-size="12" fill="#333333">局部变量</text>
<rect x="50" y="288" width="430" height="28" fill="#ffffff" stroke="#1565c0" stroke-width="1.6"/>
<text x="62" y="307" font-size="12.5" fill="#000000" font-family="Consolas, monospace">r7</text>
<text x="116" y="307" font-size="12.5" fill="#000000" font-family="Consolas, monospace">v4</text>
<text x="196" y="307" font-size="12" fill="#333333">局部变量</text>
<rect x="50" y="318" width="430" height="28" fill="#ffffff" stroke="#1565c0" stroke-width="1.6"/>
<text x="62" y="337" font-size="12.5" fill="#000000" font-family="Consolas, monospace">r8</text>
<text x="116" y="337" font-size="12.5" fill="#000000" font-family="Consolas, monospace">v5</text>
<text x="196" y="337" font-size="12" fill="#333333">局部变量</text>
<rect x="50" y="348" width="430" height="28" fill="#ffffff" stroke="#666666" stroke-width="1.6"/>
<text x="62" y="367" font-size="12.5" fill="#000000" font-family="Consolas, monospace">r9</text>
<text x="116" y="367" font-size="12.5" fill="#000000" font-family="Consolas, monospace">v6 / sb</text>
<text x="196" y="367" font-size="12" fill="#333333">平台另有定义（本工具链默认不用）</text>
<rect x="50" y="378" width="430" height="28" fill="#ffffff" stroke="#1565c0" stroke-width="1.6"/>
<text x="62" y="397" font-size="12.5" fill="#000000" font-family="Consolas, monospace">r10</text>
<text x="116" y="397" font-size="12.5" fill="#000000" font-family="Consolas, monospace">v7 / sl</text>
<text x="196" y="397" font-size="12" fill="#333333">局部变量</text>
<rect x="50" y="408" width="430" height="28" fill="#ffffff" stroke="#1565c0" stroke-width="1.6"/>
<text x="62" y="427" font-size="12.5" fill="#000000" font-family="Consolas, monospace">r11</text>
<text x="116" y="427" font-size="12.5" fill="#000000" font-family="Consolas, monospace">v8 / fp</text>
<text x="196" y="427" font-size="12" fill="#333333">帧指针</text>
<rect x="50" y="438" width="430" height="28" fill="#ffffff" stroke="#c62828" stroke-width="1.6"/>
<text x="62" y="457" font-size="12.5" fill="#000000" font-family="Consolas, monospace">r12</text>
<text x="116" y="457" font-size="12.5" fill="#000000" font-family="Consolas, monospace">ip</text>
<text x="196" y="457" font-size="12" fill="#333333">临时，链接器长跳转中转</text>
<rect x="50" y="468" width="430" height="28" fill="#ffffff" stroke="#1565c0" stroke-width="1.6"/>
<text x="62" y="487" font-size="12.5" fill="#000000" font-family="Consolas, monospace">r13</text>
<text x="116" y="487" font-size="12.5" fill="#000000" font-family="Consolas, monospace">sp</text>
<text x="196" y="487" font-size="12" fill="#333333">栈指针，公开接口处保持 8 字节对齐</text>
<rect x="50" y="498" width="430" height="28" fill="#ffffff" stroke="#c62828" stroke-width="1.6"/>
<text x="62" y="517" font-size="12.5" fill="#000000" font-family="Consolas, monospace">r14</text>
<text x="116" y="517" font-size="12.5" fill="#000000" font-family="Consolas, monospace">lr</text>
<text x="196" y="517" font-size="12" fill="#333333">返回地址，bl 写入；非叶子函数进门先存</text>
<rect x="50" y="528" width="430" height="28" fill="#ffffff" stroke="#666666" stroke-width="1.6"/>
<text x="62" y="547" font-size="12.5" fill="#000000" font-family="Consolas, monospace">r15</text>
<text x="116" y="547" font-size="12.5" fill="#000000" font-family="Consolas, monospace">pc</text>
<text x="196" y="547" font-size="12" fill="#333333">程序计数器，可写，写它即跳转</text>
<text x="530" y="66" font-size="13" fill="#000000">浮点寄存器（VFP）：同一片存储的三种视图</text>
<rect x="530" y="86" width="400" height="36" fill="#ffffff" stroke="#2e7d32" stroke-width="1.6"/>
<text x="538" y="109" font-size="12.5" font-family="Consolas, monospace" fill="#000000">q0（128 位）</text>
<rect x="530" y="150" width="200" height="36" fill="#ffffff" stroke="#2e7d32" stroke-width="1.6"/>
<rect x="730" y="150" width="200" height="36" fill="#ffffff" stroke="#2e7d32" stroke-width="1.6"/>
<text x="538" y="173" font-size="12.5" font-family="Consolas, monospace" fill="#000000">d1</text>
<text x="738" y="173" font-size="12.5" font-family="Consolas, monospace" fill="#000000">d0</text>
<rect x="530" y="214" width="100" height="36" fill="#ffffff" stroke="#2e7d32" stroke-width="1.6"/>
<text x="538" y="237" font-size="12.5" font-family="Consolas, monospace" fill="#000000">s3</text>
<rect x="630" y="214" width="100" height="36" fill="#ffffff" stroke="#2e7d32" stroke-width="1.6"/>
<text x="638" y="237" font-size="12.5" font-family="Consolas, monospace" fill="#000000">s2</text>
<rect x="730" y="214" width="100" height="36" fill="#ffffff" stroke="#2e7d32" stroke-width="1.6"/>
<text x="738" y="237" font-size="12.5" font-family="Consolas, monospace" fill="#000000">s1</text>
<rect x="830" y="214" width="100" height="36" fill="#ffffff" stroke="#2e7d32" stroke-width="1.6"/>
<text x="838" y="237" font-size="12.5" font-family="Consolas, monospace" fill="#000000">s0</text>
<line x1="530" y1="122" x2="530" y2="150" stroke="#999999" stroke-width="1"/>
<line x1="530" y1="186" x2="530" y2="214" stroke="#999999" stroke-width="1"/>
<line x1="630" y1="122" x2="630" y2="150" stroke="#999999" stroke-width="1"/>
<line x1="630" y1="186" x2="630" y2="214" stroke="#999999" stroke-width="1"/>
<line x1="730" y1="122" x2="730" y2="150" stroke="#999999" stroke-width="1"/>
<line x1="730" y1="186" x2="730" y2="214" stroke="#999999" stroke-width="1"/>
<line x1="830" y1="122" x2="830" y2="150" stroke="#999999" stroke-width="1"/>
<line x1="830" y1="186" x2="830" y2="214" stroke="#999999" stroke-width="1"/>
<line x1="930" y1="122" x2="930" y2="150" stroke="#999999" stroke-width="1"/>
<line x1="930" y1="186" x2="930" y2="214" stroke="#999999" stroke-width="1"/>
<text x="530" y="276" font-size="12" fill="#333333">高位在左：q0 = d1:d0 = s3:s2:s1:s0</text>
<text x="530" y="296" font-size="12" fill="#333333">写 s0，d0 的低 32 位跟着变；同一组存储共 32 个 s / 16 个 d / 16 个 q</text>
<text x="530" y="330" font-size="12" fill="#333333">hard 约定下，float 参数依次进 s0、s1……double 进 d0、d1……</text>
<text x="530" y="350" font-size="12" fill="#333333">（本篇 §4.2 实测：vadd.f32 s0, s0, s1）</text>
<text x="530" y="400" font-size="13" fill="#000000">保存责任怎么用（§3 实测）</text>
<text x="530" y="424" font-size="12" fill="#333333" font-family="Consolas, monospace">stmdb sp!, {r4, r5, r6, r7, r8, lr}</text>
<text x="530" y="444" font-size="12" fill="#333333" font-family="Consolas, monospace">ldmia sp!, {r4, r5, r6, r7, r8, pc}</text>
<text x="530" y="464" font-size="12" fill="#333333">要跨过调用活下来的值，只能放蓝框这一组</text>
<text x="40" y="610" font-size="12.5" fill="#000000">图例（颜色只表示"跨函数调用后值是否保值"）：</text>
<rect x="40" y="622" width="18" height="14" fill="#ffffff" stroke="#1565c0" stroke-width="1.6"/>
<text x="64" y="634" font-size="12" fill="#333333">保值：被调方借用前自己先存，走前恢复（callee-saved）</text>
<rect x="40" y="646" width="18" height="14" fill="#ffffff" stroke="#c62828" stroke-width="1.6"/>
<text x="64" y="658" font-size="12" fill="#333333">不保值：被调方可以随便用，调用方在乎就自己先存（caller-saved）</text>
<rect x="430" y="646" width="18" height="14" fill="#ffffff" stroke="#666666" stroke-width="1.6"/>
<text x="454" y="658" font-size="12" fill="#333333">特殊角色，按各自行事</text>
</svg>
