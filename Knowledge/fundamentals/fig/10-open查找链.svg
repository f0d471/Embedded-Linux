<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#000"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c00000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="560" fill="#ffffff"/>

  <!-- 用户态 -->
  <rect x="30" y="40" width="270" height="34" fill="#ffffff" stroke="#000000"/>
  <text x="45" y="61" font-family="Consolas, monospace" font-size="11">fd = open("/dev/null", O_RDWR)</text>
  <rect x="30" y="90" width="270" height="34" fill="#ffffff" stroke="#000000"/>
  <text x="45" y="111" font-family="Consolas, monospace" font-size="11">openat("/dev/null", O_RDWR)</text>
  <line x1="165" y1="74" x2="165" y2="90" stroke="#000000" marker-end="url(#arr)"/>
  <text x="310" y="61" font-family="Microsoft YaHei, sans-serif" font-size="10">你的程序</text>
  <text x="310" y="111" font-family="Microsoft YaHei, sans-serif" font-size="10">glibc 包装成系统调用</text>

  <!-- 边界 -->
  <line x1="20" y1="144" x2="860" y2="144" stroke="#000000" stroke-width="1.2"/>
  <text x="700" y="137" font-family="Microsoft YaHei, sans-serif" font-size="10.5">用户态</text>
  <text x="700" y="160" font-family="Microsoft YaHei, sans-serif" font-size="10.5">内核态</text>
  <line x1="165" y1="124" x2="165" y2="170" stroke="#000000" marker-end="url(#arr)"/>

  <!-- do_dentry_open -->
  <rect x="30" y="170" width="270" height="52" fill="#ffffff" stroke="#000000"/>
  <text x="42" y="188" font-family="Consolas, monospace" font-size="11">do_dentry_open (fs/open.c)</text>
  <text x="42" y="203" font-family="Consolas, monospace" font-size="11">f-&gt;f_op = inode-&gt;i_fop</text>
  <text x="42" y="217" font-family="Consolas, monospace" font-size="11">open(inode, f)</text>

  <!-- inode -->
  <rect x="360" y="170" width="300" height="52" fill="#ffffff" stroke="#000000"/>
  <text x="372" y="188" font-family="Consolas, monospace" font-size="11">struct inode（/dev/null）</text>
  <text x="372" y="203" font-family="Consolas, monospace" font-size="11">i_rdev = MKDEV(1, 3)</text>
  <text x="372" y="217" font-family="Consolas, monospace" font-size="11">i_fop = &amp;def_chr_fops</text>
  <text x="360" y="236" font-family="Microsoft YaHei, sans-serif" font-size="9.5">mknod 时由 init_special_inode 填入（fs/inode.c）</text>
  <line x1="300" y1="196" x2="360" y2="196" stroke="#000000" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- chrdev_open -->
  <rect x="30" y="270" width="270" height="66" fill="#ffffff" stroke="#000000"/>
  <text x="42" y="288" font-family="Consolas, monospace" font-size="11">chrdev_open (fs/char_dev.c)</text>
  <text x="42" y="303" font-family="Consolas, monospace" font-size="11">kobj_lookup(cdev_map, i_rdev)</text>
  <text x="42" y="318" font-family="Consolas, monospace" font-size="11">replace_fops(filp, cdev-&gt;ops)</text>
  <text x="42" y="332" font-family="Consolas, monospace" font-size="11">cdev-&gt;ops-&gt;open(inode, filp)</text>
  <line x1="165" y1="222" x2="165" y2="270" stroke="#000000" marker-end="url(#arr)"/>
  <text x="178" y="250" font-family="Microsoft YaHei, sans-serif" font-size="9.5">中转表 def_chr_fops 的 open</text>

  <!-- cdev_map -->
  <rect x="360" y="270" width="300" height="66" fill="#ffffff" stroke="#000000"/>
  <text x="372" y="288" font-family="Consolas, monospace" font-size="11">cdev_map</text>
  <text x="372" y="303" font-family="Consolas, monospace" font-size="11">(1, *) -&gt; struct cdev</text>
  <text x="372" y="318" font-family="Consolas, monospace" font-size="11">cdev-&gt;ops = memory_fops</text>
  <text x="360" y="350" font-family="Microsoft YaHei, sans-serif" font-size="9.5">register_chrdev(1, "mem", ...) 时登记；/proc/devices 打的就是这张表</text>
  <line x1="300" y1="296" x2="360" y2="296" stroke="#000000" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- memory_open -->
  <rect x="30" y="390" width="270" height="52" fill="#ffffff" stroke="#000000"/>
  <text x="42" y="408" font-family="Consolas, monospace" font-size="11">memory_open (drivers/char/mem.c)</text>
  <text x="42" y="423" font-family="Consolas, monospace" font-size="11">minor = iminor(inode)  /* 3 */</text>
  <text x="42" y="437" font-family="Consolas, monospace" font-size="11">filp-&gt;f_op = devlist[3].fops</text>
  <line x1="165" y1="336" x2="165" y2="390" stroke="#000000" marker-end="url(#arr)"/>

  <!-- devlist -->
  <rect x="360" y="390" width="300" height="52" fill="#ffffff" stroke="#000000"/>
  <text x="372" y="408" font-family="Consolas, monospace" font-size="11">devlist[]</text>
  <text x="372" y="423" font-family="Consolas, monospace" font-size="11">[3] = { "null", 0666, null_fops }</text>
  <text x="372" y="437" font-family="Consolas, monospace" font-size="11">[5] = { "zero", 0666, zero_fops }</text>
  <text x="360" y="456" font-family="Microsoft YaHei, sans-serif" font-size="9.5">数组下标就是次设备号</text>
  <line x1="300" y1="416" x2="360" y2="416" stroke="#000000" marker-end="url(#arr)"/>

  <!-- 结果 -->
  <rect x="30" y="480" width="460" height="44" fill="#ffffff" stroke="#000000"/>
  <text x="42" y="498" font-family="Consolas, monospace" font-size="11">open 返回：fd -&gt; struct file，f_op = null_fops</text>
  <text x="42" y="514" font-family="Consolas, monospace" font-size="11">此后 read(fd) 返回 0；write(fd) 返回 count</text>
  <line x1="165" y1="442" x2="165" y2="480" stroke="#000000" marker-end="url(#arr)"/>

  <!-- 拒绝支路（红色虚线，走行与行之间的空隙） -->
  <rect x="700" y="170" width="160" height="52" fill="#ffffff" stroke="#c00000" stroke-dasharray="5,3"/>
  <text x="712" y="188" font-family="Consolas, monospace" font-size="11" fill="#c00000">-EACCES</text>
  <text x="712" y="203" font-family="Consolas, monospace" font-size="9.5">may_open: nodev</text>
  <text x="712" y="217" font-family="Microsoft YaHei, sans-serif" font-size="9.5">例：/tmp 下的节点</text>
  <path d="M240,170 L240,157 L780,157 L780,170" fill="none" stroke="#c00000" stroke-dasharray="5,3" marker-end="url(#arrR)"/>

  <rect x="700" y="270" width="160" height="52" fill="#ffffff" stroke="#c00000" stroke-dasharray="5,3"/>
  <text x="712" y="288" font-family="Consolas, monospace" font-size="11" fill="#c00000">-ENXIO</text>
  <text x="712" y="303" font-family="Consolas, monospace" font-size="9.5">cdev_map 查不到</text>
  <text x="712" y="317" font-family="Microsoft YaHei, sans-serif" font-size="9.5">例：c 200,0</text>
  <path d="M260,270 L260,258 L780,258 L780,270" fill="none" stroke="#c00000" stroke-dasharray="5,3" marker-end="url(#arrR)"/>

  <rect x="700" y="390" width="160" height="52" fill="#ffffff" stroke="#c00000" stroke-dasharray="5,3"/>
  <text x="712" y="408" font-family="Consolas, monospace" font-size="11" fill="#c00000">-ENODEV</text>
  <text x="712" y="423" font-family="Consolas, monospace" font-size="9.5">fb_open: 无此实例</text>
  <text x="712" y="437" font-family="Microsoft YaHei, sans-serif" font-size="9.5">例：WSL 里 c 29,0</text>
  <path d="M280,336 L280,363 L780,363 L780,390" fill="none" stroke="#c00000" stroke-dasharray="5,3" marker-end="url(#arrR)"/>
  <text x="420" y="376" font-family="Microsoft YaHei, sans-serif" font-size="9.5" fill="#c00000">驱动自己的 open 拒绝时</text>

  <!-- 图例 -->
  <rect x="520" y="470" width="340" height="56" fill="#ffffff" stroke="#000000"/>
  <text x="532" y="488" font-family="Microsoft YaHei, sans-serif" font-size="10">实线 = 会执行的通路</text>
  <text x="532" y="504" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#c00000">红色虚线 = 被拒绝的通路（返回负 errno）</text>
  <text x="532" y="520" font-family="Microsoft YaHei, sans-serif" font-size="10">横线 = 用户态 / 内核态边界</text>
</svg>
