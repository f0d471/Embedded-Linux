<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540" font-family="Microsoft YaHei, sans-serif">
<rect x="0" y="0" width="980" height="540" fill="#ffffff"/>
<defs><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker></defs>
<text x="40" y="34" font-size="16" fill="#000000">float fadd2(float a, float b) 在三种浮点约定下的交接（2026-10-20 实测）</text>
<rect x="40" y="52" width="280" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="180" y="74" font-size="13.5" text-anchor="middle" font-family="Consolas, monospace" fill="#000000">-mfloat-abi=hard</text>
<text x="180" y="104" font-size="11.5" text-anchor="middle" fill="#555555">函数体 2 条指令</text>
<rect x="40" y="122" width="280" height="74" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="52" y="144" font-size="12" fill="#333333">调用方放参数</text>
<text x="52" y="168" font-size="12.5" font-family="Consolas, monospace" fill="#2e7d32">  a  -&gt;  s0</text>
<text x="52" y="190" font-size="12.5" font-family="Consolas, monospace" fill="#2e7d32">  b  -&gt;  s1</text>
<line x1="180" y1="196" x2="180" y2="222" stroke="#000000" stroke-width="1.5" marker-end="url(#arr2)"/>
<rect x="40" y="222" width="280" height="72" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="52" y="243" font-size="12" fill="#333333">fadd2 函数体</text>
<text x="52" y="265" font-size="12" font-family="Consolas, monospace" fill="#000000">vadd.f32 s0, s0, s1</text>
<text x="52" y="286" font-size="12" font-family="Consolas, monospace" fill="#000000">bx lr</text>
<rect x="40" y="308" width="280" height="32" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="180" y="329" font-size="12" text-anchor="middle" fill="#000000">VFP：直接算</text>
<rect x="40" y="354" width="280" height="30" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="52" y="374" font-size="12.5" fill="#333333">返回值放在 </text>
<text x="140" y="374" font-size="12.5" font-family="Consolas, monospace" fill="#2e7d32">s0</text>
<rect x="350" y="52" width="280" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="490" y="74" font-size="13.5" text-anchor="middle" font-family="Consolas, monospace" fill="#000000">-mfloat-abi=softfp</text>
<text x="490" y="104" font-size="11.5" text-anchor="middle" fill="#555555">函数体 5 条指令</text>
<rect x="350" y="122" width="280" height="74" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="362" y="144" font-size="12" fill="#333333">调用方放参数</text>
<text x="362" y="168" font-size="12.5" font-family="Consolas, monospace" fill="#1565c0">  a  -&gt;  r0</text>
<text x="362" y="190" font-size="12.5" font-family="Consolas, monospace" fill="#1565c0">  b  -&gt;  r1</text>
<line x1="490" y1="196" x2="490" y2="222" stroke="#000000" stroke-width="1.5" marker-end="url(#arr2)"/>
<rect x="350" y="222" width="280" height="135" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="362" y="243" font-size="12" fill="#333333">fadd2 函数体</text>
<text x="362" y="265" font-size="12" font-family="Consolas, monospace" fill="#000000">vmov s14, r0</text>
<text x="362" y="286" font-size="12" font-family="Consolas, monospace" fill="#000000">vmov s15, r1</text>
<text x="362" y="307" font-size="12" font-family="Consolas, monospace" fill="#000000">vadd.f32 s15, s14, s15</text>
<text x="362" y="328" font-size="12" font-family="Consolas, monospace" fill="#000000">vmov r0, s15</text>
<text x="362" y="349" font-size="12" font-family="Consolas, monospace" fill="#000000">bx lr</text>
<rect x="350" y="371" width="280" height="32" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="490" y="392" font-size="12" text-anchor="middle" fill="#000000">VFP：算之前先搬，算完再搬回</text>
<rect x="350" y="417" width="280" height="30" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="362" y="437" font-size="12.5" fill="#333333">返回值放在 </text>
<text x="450" y="437" font-size="12.5" font-family="Consolas, monospace" fill="#1565c0">r0</text>
<text x="350" y="469" font-size="11.5" fill="#555555">三条 vmov 是纯搬运</text>
<rect x="660" y="52" width="280" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="800" y="74" font-size="13.5" text-anchor="middle" font-family="Consolas, monospace" fill="#000000">-mfloat-abi=soft</text>
<text x="800" y="104" font-size="11.5" text-anchor="middle" fill="#555555">函数体 3 条，含一次函数调用</text>
<rect x="660" y="122" width="280" height="74" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="672" y="144" font-size="12" fill="#333333">调用方放参数</text>
<text x="672" y="168" font-size="12.5" font-family="Consolas, monospace" fill="#1565c0">  a  -&gt;  r0</text>
<text x="672" y="190" font-size="12.5" font-family="Consolas, monospace" fill="#1565c0">  b  -&gt;  r1</text>
<line x1="800" y1="196" x2="800" y2="222" stroke="#000000" stroke-width="1.5" marker-end="url(#arr2)"/>
<rect x="660" y="222" width="280" height="93" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="672" y="243" font-size="12" fill="#333333">fadd2 函数体</text>
<text x="672" y="265" font-size="12" font-family="Consolas, monospace" fill="#000000">push {r3, lr}</text>
<text x="672" y="286" font-size="12" font-family="Consolas, monospace" fill="#000000">bl __aeabi_fadd</text>
<text x="672" y="307" font-size="12" font-family="Consolas, monospace" fill="#000000">pop {r3, pc}</text>
<rect x="660" y="329" width="280" height="32" fill="#ffffff" stroke="#666666" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="800" y="350" font-size="12" text-anchor="middle" fill="#666666">VFP：未接入</text>
<rect x="660" y="375" width="280" height="30" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="672" y="395" font-size="12.5" fill="#333333">返回值放在 </text>
<text x="760" y="395" font-size="12.5" font-family="Consolas, monospace" fill="#1565c0">r0</text>
<text x="660" y="427" font-size="11.5" fill="#555555">__aeabi_fadd：libgcc 里的软件模拟</text>
<rect x="40" y="484" width="16" height="12" fill="#ffffff" stroke="#2e7d32" stroke-width="1.6"/>
<text x="62" y="494" font-size="12" fill="#333333">绿字：浮点寄存器（s/d）通路</text>
<rect x="300" y="484" width="16" height="12" fill="#ffffff" stroke="#1565c0" stroke-width="1.6"/>
<text x="322" y="494" font-size="12" fill="#333333">蓝字：通用寄存器（r）通路</text>
<rect x="560" y="484" width="16" height="12" fill="#ffffff" stroke="#666666" stroke-width="1.6" stroke-dasharray="7 4"/>
<text x="582" y="494" font-size="12" fill="#333333">虚线：未接入的部件</text>
</svg>
