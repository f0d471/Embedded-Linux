<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#333"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Microsoft YaHei", sans-serif; fill: #222; }
    .code { font-family: Consolas, monospace; }
    .t { font-size: 18px; font-weight: bold; }
    .h { font-size: 13px; font-weight: bold; }
    .b { font-size: 12px; }
    .s { font-size: 11px; fill: #555; }
    .lb { font-size: 11px; fill: #333; }
    rect.box { fill: #fff; stroke: #333; stroke-width: 1.2; }
    rect.pan { fill: #fafafa; stroke: #999; stroke-width: 1; }
    path.w { fill: none; stroke: #333; stroke-width: 1.4; }
  </style>

  <rect x="0" y="0" width="1000" height="560" fill="#fff"/>
  <text class="t" x="24" y="32">三个时刻、三套搜索路径：一个选项救不了另一个时刻</text>
  <text class="s" x="24" y="54">上排：开发机上的两个时刻（staging 供料）。下排：板子上的第三个时刻（rootfs 供料）。</text>

  <!-- staging -->
  <rect class="box" x="40" y="80" width="400" height="88"/>
  <text class="h" x="56" y="104">staging（电脑上的临时假根，DESTDIR 装出来的）</text>
  <text class="code s" x="56" y="126">$STAGE/usr/include/freetype2/ft2build.h</text>
  <text class="code s" x="56" y="146">$STAGE/usr/lib/libfreetype.so -> .so.6 -> .so.6.17.2</text>

  <!-- 时刻1 -->
  <rect class="pan" x="40" y="196" width="400" height="180"/>
  <text class="h" x="56" y="220">时刻 1　编译（电脑，cc1 预处理）</text>
  <text class="s" x="56" y="242">找什么：#include &lt;ft2build.h&gt; 的声明</text>
  <text class="code s" x="56" y="264">谁指路：-I$STAGE/usr/include/freetype2</text>
  <text class="code s" x="56" y="282">　　　　　pkg-config --cflags freetype2</text>
  <text class="s" x="56" y="308">找不到时：</text>
  <text class="code s" x="56" y="326">fatal error: ft2build.h: No such file</text>
  <text class="s" x="56" y="356">头文件不进板上运行流程，只喂编译器</text>

  <path class="w" d="M240,168 L240,196" marker-end="url(#ar)"/>
  <text class="lb" x="250" y="186">头文件从这里来</text>

  <path class="w" d="M240,376 L240,404" marker-end="url(#ar)"/>
  <text class="lb" x="250" y="394">同一个 staging 的 lib 目录</text>

  <!-- 时刻2 -->
  <rect class="pan" x="40" y="406" width="400" height="130"/>
  <text class="h" x="56" y="430">时刻 2　链接（电脑，ld）</text>
  <text class="s" x="56" y="452">找什么：libfreetype.so（开发链接名）</text>
  <text class="code s" x="56" y="474">谁指路：-L$STAGE/usr/lib -lfreetype</text>
  <text class="s" x="56" y="496">找不到时：</text>
  <text class="code s" x="56" y="514">cannot find -lfreetype / undefined reference</text>

  <!-- 交付 -->
  <rect class="box" x="560" y="80" width="400" height="88"/>
  <text class="h" x="576" y="104">板子的根文件系统（交付后的家）</text>
  <text class="code s" x="576" y="126">/usr/lib/libfreetype.so.6 -> libfreetype.so.6.17.2</text>
  <text class="s" x="576" y="148">SONAME 链接 + 真身，应用也一样交过去</text>

  <path class="w" d="M440,124 L560,124" marker-end="url(#ar)"/>
  <text class="lb" x="444" y="114">交付（scp/rootfs 配方）</text>

  <!-- 时刻3 -->
  <rect class="pan" x="560" y="196" width="400" height="340"/>
  <text class="h" x="576" y="220">时刻 3　运行（板上，ld.so 加载器）</text>
  <text class="s" x="576" y="242">找什么：NEEDED 里的 SONAME libfreetype.so.6</text>
  <text class="code s" x="576" y="264">谁指路：按 05 篇第 4 节的五级次序</text>
  <text class="code s" x="576" y="282">　RPATH / LD_LIBRARY_PATH / RUNPATH</text>
  <text class="code s" x="576" y="300">　/ ld.so.cache / 默认目录（板上是 /usr/lib）</text>
  <text class="s" x="576" y="326">找不到时：</text>
  <text class="code s" x="576" y="344">cannot open shared object file（退出码 127）</text>
  <text class="s" x="576" y="370">相关检查：</text>
  <text class="code s" x="576" y="392">readelf -h　　Machine 是不是 ARM</text>
  <text class="code s" x="576" y="410">readelf -d　　NEEDED 清单与 SONAME</text>
  <text class="s" x="576" y="436">glibc 版本对不上：version \`X' not found（05 篇第 5 节）</text>
  <text class="s" x="576" y="466">静态链接把这一列检查整体换成"体积与许可证"</text>
  <text class="s" x="576" y="484">两难见第 6 节：动态小而多依赖，静态大而自足</text>
  <text class="s" x="576" y="514">链接成功不代表能跑：-L 管不到这一列</text>

  <path class="w" d="M440,470 L560,470" marker-end="url(#ar)"/>
  <text class="lb" x="444" y="460">应用交到板上之后</text>

  <text class="s" x="24" y="548">报错属于哪个时刻，就到那一列找解法：-I 救不了链接，-L 救不了运行，LD_LIBRARY_PATH 救不了编译。</text>
</svg>
