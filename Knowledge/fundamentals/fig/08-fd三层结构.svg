<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="1240" height="640" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- 第 1 层: 进程自己的 fd 表 -->
  <text x="40" y="36" font-size="14" fill="#333333">第 1 层：进程自己的 fd 表（每个进程一张）</text>

  <rect x="40" y="52" width="170" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="125" y="74" font-size="13" text-anchor="middle" fill="#000000" font-family="Consolas, monospace">task_struct</text>
  <line x1="125" y1="86" x2="125" y2="104" stroke="#666666" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="133" y="99" font-size="11" fill="#666666" font-family="Consolas, monospace">.files</text>

  <rect x="40" y="104" width="170" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="125" y="126" font-size="13" text-anchor="middle" fill="#000000" font-family="Consolas, monospace">files_struct</text>
  <line x1="125" y1="138" x2="125" y2="156" stroke="#666666" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="133" y="151" font-size="11" fill="#666666" font-family="Consolas, monospace">.fdt</text>

  <rect x="40" y="156" width="170" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="125" y="178" font-size="13" text-anchor="middle" fill="#000000" font-family="Consolas, monospace">fdtable.fd[]</text>

  <g font-size="13" text-anchor="middle" font-family="Consolas, monospace">
    <rect x="40" y="208" width="150" height="34" fill="#f5f5f5" stroke="#999999"/><text x="115" y="230" fill="#777777">0  stdin</text>
    <rect x="40" y="242" width="150" height="34" fill="#f5f5f5" stroke="#999999"/><text x="115" y="264" fill="#777777">1  stdout</text>
    <rect x="40" y="276" width="150" height="34" fill="#f5f5f5" stroke="#999999"/><text x="115" y="298" fill="#777777">2  stderr</text>
    <rect x="40" y="310" width="150" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="115" y="332" fill="#000000">3</text>
    <rect x="40" y="344" width="150" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="115" y="366" fill="#000000">4</text>
    <rect x="40" y="378" width="150" height="34" fill="#ffffff" stroke="#1565c0" stroke-width="1.6"/><text x="115" y="400" fill="#1565c0">5 = dup(3)</text>
  </g>
  <text x="115" y="432" font-size="11.5" text-anchor="middle" fill="#666666">0/1/2 由 shell 经 fork 继承，</text>
  <text x="115" y="448" font-size="11.5" text-anchor="middle" fill="#666666">指向终端（图中未画）</text>

  <!-- 第 2 层: struct file -->
  <text x="470" y="36" font-size="14" fill="#333333">第 2 层：struct file（每 open 一次新建一份）</text>

  <rect x="470" y="266" width="280" height="112" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="610" y="291" font-size="14" text-anchor="middle" fill="#000000" font-family="Consolas, monospace">struct file A</text>
  <text x="610" y="313" font-size="12" text-anchor="middle" fill="#444444" font-family="Consolas, monospace">f_pos = 1（fd3 读过 1 字节）</text>
  <text x="610" y="333" font-size="12" text-anchor="middle" fill="#444444" font-family="Consolas, monospace">f_flags = O_RDONLY|O_LARGEFILE</text>
  <text x="610" y="353" font-size="12" text-anchor="middle" fill="#444444" font-family="Consolas, monospace">f_op -&gt; ext4 的函数表</text>

  <rect x="470" y="440" width="280" height="112" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="610" y="465" font-size="14" text-anchor="middle" fill="#000000" font-family="Consolas, monospace">struct file B</text>
  <text x="610" y="487" font-size="12" text-anchor="middle" fill="#444444" font-family="Consolas, monospace">f_pos = 0（没人动过）</text>
  <text x="610" y="507" font-size="12" text-anchor="middle" fill="#444444" font-family="Consolas, monospace">f_flags = O_RDONLY|O_LARGEFILE</text>
  <text x="610" y="527" font-size="12" text-anchor="middle" fill="#444444" font-family="Consolas, monospace">f_op -&gt; ext4 的函数表</text>

  <!-- 第 3 层: inode -->
  <text x="930" y="36" font-size="14" fill="#333333">第 3 层：inode（这个文件本身，只有一份）</text>
  <rect x="930" y="330" width="260" height="118" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="1060" y="356" font-size="14" text-anchor="middle" fill="#000000" font-family="Consolas, monospace">inode（data.txt）</text>
  <text x="1060" y="379" font-size="12" text-anchor="middle" fill="#444444">大小、权限、时间戳</text>
  <text x="1060" y="399" font-size="12" text-anchor="middle" fill="#444444">数据块在磁盘的位置</text>
  <text x="1060" y="424" font-size="12" text-anchor="middle" fill="#666666">文件名不在这里，在目录项里</text>

  <!-- 连线: open(黑) -->
  <line x1="190" y1="327" x2="464" y2="310" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="190" y1="361" x2="464" y2="475" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="300" y="296" font-size="12" fill="#333333">open 第 1 次：新建 A</text>
  <text x="490" y="432" font-size="12" fill="#333333">open 第 2 次：再建 B（f_pos 各算各的）</text>

  <!-- 连线: dup(蓝) -->
  <path d="M 190 395 C 260 470, 340 470, 464 350" fill="none" stroke="#1565c0" stroke-width="1.8" marker-end="url(#arrB)"/>
  <text x="240" y="470" font-size="12" fill="#1565c0">dup：指到已有的 A</text>

  <!-- struct file -> inode -->
  <line x1="750" y1="322" x2="924" y2="368" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="750" y1="496" x2="924" y2="420" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="800" y="330" font-size="12" fill="#666666" font-family="Consolas, monospace">f_inode</text>
  <text x="800" y="470" font-size="12" fill="#666666" font-family="Consolas, monospace">f_inode</text>

  <!-- 实验对照与图例 -->
  <text x="40" y="540" font-size="12.5" fill="#333333">对应第 0 节实验：从 fd3 读 1 字节后，A 的 f_pos 由 0 变 1；fd5 指向同一个 A，所以它的 pos 也是 1；</text>
  <text x="40" y="560" font-size="12.5" fill="#333333">fd4 指向另一份 B，仍是 0。/proc/self/fdinfo 里看到的就是 f_pos 和 f_flags。</text>

  <line x1="40" y1="596" x2="80" y2="596" stroke="#000000" stroke-width="1.5"/>
  <text x="86" y="601" font-size="12" fill="#333333">open：这一格指向新建的一份 struct file</text>
  <line x1="430" y1="596" x2="470" y2="596" stroke="#1565c0" stroke-width="1.8"/>
  <text x="476" y="601" font-size="12" fill="#333333">dup / dup2 / fork：多一格指向同一份（共享 f_pos 与 f_flags）</text>
</svg>
