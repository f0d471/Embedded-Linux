<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="1240" height="680" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- 用户态 -->
  <rect x="40" y="24" width="1160" height="92" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <text x="56" y="46" font-size="13" fill="#555555">用户态</text>

  <rect x="80" y="56" width="300" height="44" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="230" y="83" font-size="13" text-anchor="middle" fill="#000000" font-family="Consolas, monospace">app: n = read(fd, buf, 5)</text>

  <line x1="380" y1="78" x2="506" y2="78" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="512" y="56" width="260" height="44" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="642" y="83" font-size="13" text-anchor="middle" fill="#000000" font-family="Consolas, monospace">glibc: read() 封装</text>

  <line x1="772" y1="78" x2="898" y2="78" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="904" y="56" width="240" height="44" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="1024" y="76" font-size="12.5" text-anchor="middle" fill="#000000" font-family="Consolas, monospace">调用号入 r7，执行 svc</text>
  <text x="1024" y="93" font-size="11" text-anchor="middle" fill="#666666">（见 fundamentals 07 篇）</text>

  <!-- 边界 -->
  <line x1="40" y1="140" x2="1200" y2="140" stroke="#c62828" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="56" y="162" font-size="12" fill="#b71c1c">用户态 / 内核态边界：以下都在内核里（fs/read_write.c）</text>

  <!-- 内核主线 -->
  <rect x="460" y="180" width="330" height="66" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="625" y="204" font-size="13" text-anchor="middle" fill="#000000" font-family="Consolas, monospace">sys_read(fd, buf, 5)</text>
  <text x="625" y="224" font-size="11.5" text-anchor="middle" fill="#444444" font-family="Consolas, monospace">fdget_pos(fd)：查本进程 fd 表，拿到 struct file</text>

  <line x1="625" y1="246" x2="625" y2="272" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="460" y="276" width="330" height="52" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="625" y="298" font-size="13" text-anchor="middle" fill="#000000" font-family="Consolas, monospace">vfs_read：检查读权限与缓冲区</text>
  <text x="625" y="317" font-size="11.5" text-anchor="middle" fill="#444444" font-family="Consolas, monospace">f_pos 从这里取出，读完写回</text>

  <line x1="625" y1="328" x2="625" y2="354" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="460" y="358" width="330" height="56" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="625" y="381" font-size="13" text-anchor="middle" fill="#000000" font-family="Consolas, monospace">__vfs_read：分岔点</text>
  <text x="625" y="401" font-size="11.5" text-anchor="middle" fill="#444444" font-family="Consolas, monospace">f_op-&gt;read 有就调它，否则调 f_op-&gt;read_iter</text>

  <!-- 四条分支 -->
  <line x1="560" y1="414" x2="180" y2="470" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="600" y1="414" x2="465" y2="470" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="655" y1="414" x2="750" y2="470" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="695" y1="414" x2="1040" y2="470" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="330" y="448" font-size="11.5" fill="#666666">打开的是哪种对象，f_op 就指到哪张表（open 时填好）</text>

  <!-- 四个实现 -->
  <rect x="40" y="474" width="270" height="118" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="175" y="497" font-size="12.5" text-anchor="middle" fill="#000000" font-family="Consolas, monospace">ext4_file_operations</text>
  <text x="175" y="517" font-size="11.5" text-anchor="middle" fill="#444444">打开 data.txt 时填这张</text>
  <text x="175" y="537" font-size="11.5" text-anchor="middle" fill="#444444">定位数据块，经页缓存读写</text>
  <text x="175" y="561" font-size="11.5" text-anchor="middle" fill="#1565c0">实测：read 返回 5，读回 hello</text>

  <rect x="330" y="474" width="270" height="118" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="465" y="497" font-size="12.5" text-anchor="middle" fill="#000000" font-family="Consolas, monospace">null_fops（/dev/null）</text>
  <text x="465" y="517" font-size="11.5" text-anchor="middle" fill="#444444" font-family="Consolas, monospace">.read = read_null：return 0</text>
  <text x="465" y="537" font-size="11.5" text-anchor="middle" fill="#444444" font-family="Consolas, monospace">.write = write_null：return count</text>
  <text x="465" y="561" font-size="11.5" text-anchor="middle" fill="#1565c0">实测：read 返回 0（永远 EOF）</text>

  <rect x="620" y="474" width="270" height="118" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="755" y="497" font-size="12.5" text-anchor="middle" fill="#000000" font-family="Consolas, monospace">zero_fops（/dev/zero）</text>
  <text x="755" y="517" font-size="11.5" text-anchor="middle" fill="#444444">没有 .read，只有 .read_iter</text>
  <text x="755" y="537" font-size="11.5" text-anchor="middle" fill="#444444" font-family="Consolas, monospace">read_iter_zero：把 buf 填 0</text>
  <text x="755" y="561" font-size="11.5" text-anchor="middle" fill="#1565c0">实测：read 返回 5，是 5 个 '\0'</text>

  <rect x="910" y="474" width="290" height="118" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="1055" y="497" font-size="12.5" text-anchor="middle" fill="#000000" font-family="Consolas, monospace">tty_fops（/dev/tty）</text>
  <text x="1055" y="517" font-size="11.5" text-anchor="middle" fill="#444444">读：等键盘或串口有输入</text>
  <text x="1055" y="537" font-size="11.5" text-anchor="middle" fill="#444444" font-family="Consolas, monospace">.unlocked_ioctl 认得 TIOCGWINSZ</text>
  <text x="1055" y="561" font-size="11.5" text-anchor="middle" fill="#1565c0">实测：ioctl 成功，30 行 120 列</text>

  <!-- 图例 -->
  <line x1="40" y1="630" x2="80" y2="630" stroke="#000000" stroke-width="1.5"/>
  <text x="86" y="635" font-size="12" fill="#333333">会执行的调用通路（走哪条分支由 fd 背后的 f_op 决定）</text>
  <line x1="40" y1="658" x2="80" y2="658" stroke="#c62828" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="86" y="663" font-size="12" fill="#333333">用户态 / 内核态边界</text>
  <text x="560" y="663" font-size="12" fill="#333333">表里的函数名来自内核源码：fs/read_write.c、drivers/char/mem.c（v4.9.88 核对）</text>
</svg>
